name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/pdbethke/corralai/blob/main/CLA.md'
          branch: 'main'
          # contributor-assistant matches the allowlist against each committer's
          # name — the GitHub login when the commit's author email is linked to
          # an account, else the raw git author name. Claude-authored commits use
          # `noreply@anthropic.com`, which links to no account, so they surface as
          # the bare author name "Claude" (never `bot*`). Exempt that identity so
          # AI-authored PRs don't hang on a CLA the human operator already signed.
          allowlist: 'pdbethke,bot*,Claude'
