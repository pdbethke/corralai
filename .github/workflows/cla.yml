name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/pdbethke/corralai/blob/main/CLA.md'
          branch: 'main'
          # contributor-assistant resolves each commit to
          #   commit.author.user || commit.committer.user || commit.author || commit.committer
          # and matches the allowlist against `login || name` — CASE-SENSITIVELY,
          # by exact string equality (patterns containing `*` become regexes).
          #
          # Claude-authored commits use `noreply@anthropic.com`, which IS linked
          # to a real GitHub account (login `claude`, id 81847), so the LOGIN wins
          # and the identity presented is lowercase `claude` — not the git author
          # name "Claude". Exempt that login so AI-authored PRs don't hang on a CLA
          # the human operator already signed.
          allowlist: 'pdbethke,bot*,claude'
