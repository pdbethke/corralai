name: CodeQL

# Static analysis that runs on the code itself, in addition to gosec in
# scripts/check-security.sh. gosec is a Go-only linter; CodeQL does data-flow
# analysis and also covers the Astro site's JavaScript/TypeScript.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["go", "javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          # Go is built by hand below, so the build is the module's own (cgo
          # included: go-duckdb) rather than whatever autobuild guesses.
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      - name: Build (Go)
        if: matrix.language == 'go'
        run: go build ./...
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
