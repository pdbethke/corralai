# SPDX-License-Identifier: Elastic-2.0
#
# Deploys the corralai.dev marketing/docs site (site/) to Cloudflare Pages.
# Independent of the main Deploy workflow (deploy.yml), which builds and
# restarts the brain on the self-hosted runner — this job never touches
# that pipeline and runs entirely on ubuntu-latest.
#
# Path-filtered on site/** plus internal/ui/web/replay-player.js, since the
# site vendors a synced copy of the replay player (see
# scripts/sync-site-assets.sh) — a change to the source file needs a site
# redeploy even though nothing under site/ changed.
name: Deploy site

# Least privilege: this workflow only checks out code and deploys to
# Cloudflare Pages via an API token secret — it never mutates the repo.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "internal/ui/web/replay-player.js"
      - ".github/workflows/deploy-site.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "internal/ui/web/replay-player.js"
  workflow_dispatch:
    # Manual trigger — fire the first deploy by hand once the Cloudflare
    # secrets exist (see the human handoff in task-6-report.md), without
    # needing a throwaway site/** commit.

jobs:
  test:
    # A site change can never ship against Go-side code that is red WHERE THE
    # SITE DEPENDS ON IT — golden-run.json and replay-player.js both come from
    # Go-side code, and internal/ui additionally carries the signed console
    # bundle whose manifest hashes replay-player.js.
    #
    # Scoped to those packages ON PURPOSE, rather than `go test ./...`. The full
    # suite is already gated on every push and PR by deploy.yml's validate job,
    # so re-running it here protects nothing that isn't protected — while doing
    # real harm: this workflow is path-filtered on `site/**`, so it runs only
    # when someone edits the site, and it provisions none of the polyglot
    # toolchains (Python/Ruby/JS) that validate installs for the audit-gate
    # tests. The result was unrelated Go-side breakage lying dormant for weeks
    # and then detonating on whoever next touched a docs page: a pytest-
    # dependent adequacy test merged 2026-07-30 red-built the next site PR on
    # 2026-07-31, whose diff was markdown only.
    name: Round up the Go test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./internal/ui/ ./internal/recordings/ -count=1

  deploy:
    name: Drive the site to Cloudflare Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Astro 7 requires >=22.12.0 (site/package.json engines) — 20 would
          # fail the build outright.
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The player-sync and CLI-reference drift gates used to live here. They
      # have moved to deploy.yml's validate job, which runs on EVERY push and
      # pull request with no path filter — the only place that sees every change
      # to their Go-side inputs. Here they were doubly unreachable: this
      # workflow is path-filtered on `site/**`, and this job is additionally
      # gated `if: github.event_name != 'pull_request'`, so a CLI-help change
      # (which touches no site file and usually arrives BY pull request) could
      # never trip them. `npm run build` below still runs sync-site-assets via
      # its own `prebuild` hook, so a stale vendored player still cannot ship.
      - name: Corral dependencies
        working-directory: site
        run: npm ci
      - name: Saddle up Playwright's browser
        # test:e2e (below) drives a real Chromium against the built site —
        # the runner image ships no browsers, so without this step the herd
        # never gets out of the gate.
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Build + smoke-test the site
        working-directory: site
        run: npm run test:e2e
      - name: Deploy to Cloudflare Pages
        working-directory: site
        # Pinned to the wrangler 4 major (4.107.0 at authoring time) so a
        # future major release can't silently change pages-deploy flag
        # semantics without a reviewable diff here.
        run: npx wrangler@4 pages deploy dist --project-name=corralai-dev --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
