# SPDX-License-Identifier: Elastic-2.0
#
# Deploys the corralai.dev marketing/docs site (site/) to Cloudflare Pages.
# Independent of the main Deploy workflow (deploy.yml), which builds and
# restarts the brain on the self-hosted runner — this job never touches
# that pipeline and runs entirely on ubuntu-latest.
#
# Path-filtered on site/** plus internal/ui/web/replay-player.js, since the
# site vendors a synced copy of the replay player (see
# scripts/sync-site-assets.sh) — a change to the source file needs a site
# redeploy even though nothing under site/ changed.
name: Deploy site

# Least privilege: this workflow only checks out code and deploys to
# Cloudflare Pages via an API token secret — it never mutates the repo.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "internal/ui/web/replay-player.js"
      - ".github/workflows/deploy-site.yml"
      # The /ledger/ pages are rendered by these at deploy time.
      - "internal/recordview/**"
      - "scripts/ledgersite/**"
      - "scripts/gen-ledger-site.sh"
      # /results/ runs the ledger verifier in the visitor's browser, built
      # from this commit at site build (site/scripts/build-ledger-wasm.mjs),
      # so a verifier change must redeploy the page that runs it.
      - "internal/ledger/**"
      - "scripts/build-ledger-wasm.sh"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "internal/ui/web/replay-player.js"
      - "internal/recordview/**"
      - "scripts/ledgersite/**"
      - "scripts/gen-ledger-site.sh"
      - "internal/ledger/**"
      - "scripts/build-ledger-wasm.sh"
  # The /ledger/ pages are rendered from the corral/ledger branch at deploy
  # time, and new entries (the Action, the campaign's weekly runs) never touch
  # site/**, so without this the record page lagged until the next site
  # change. A push to corral/ledger cannot trigger it: that branch is an
  # orphan with no workflow files. Daily is enough for a weekly campaign.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    # Manual trigger — fire the first deploy by hand once the Cloudflare
    # secrets exist (see the human handoff in task-6-report.md), without
    # needing a throwaway site/** commit.

jobs:
  test:
    # A site change can never ship against Go-side code that is red WHERE THE
    # SITE DEPENDS ON IT — golden-run.json and replay-player.js both come from
    # Go-side code, and internal/ui additionally carries the signed console
    # bundle whose manifest hashes replay-player.js.
    #
    # Scoped to those packages ON PURPOSE, rather than `go test ./...`. The full
    # suite is already gated on every push and PR by deploy.yml's validate job,
    # so re-running it here protects nothing that isn't protected — while doing
    # real harm: this workflow is path-filtered on `site/**`, so it runs only
    # when someone edits the site, and it provisions none of the polyglot
    # toolchains (Python/Ruby/JS) that validate installs for the audit-gate
    # tests. The result was unrelated Go-side breakage lying dormant for weeks
    # and then detonating on whoever next touched a docs page: a pytest-
    # dependent adequacy test merged 2026-07-30 red-built the next site PR on
    # 2026-07-31, whose diff was markdown only.
    name: Round up the Go test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./internal/ui/ ./internal/recordings/ -count=1

  deploy:
    name: Drive the site to Cloudflare Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One production deploy at a time, and every deploy ships main as it
    # stands when the job starts, never the commit that triggered it.
    #
    # Both halves are needed. On 2026-11-05 two site PRs merged 40 seconds
    # apart; both deploy jobs ran at once, and the OLDER commit's finished 9
    # seconds later, so production served a build without the newer PR's
    # field note until a manual redeploy. A queue alone does not fix that:
    # whichever job reached the queue second would still deploy last, and that
    # could be the older one. Building main inside the queue does: each job
    # checks out main after every earlier deploy has finished, so the last
    # deploy is always of the newest main. Whatever it ships is built and
    # smoke-tested below (test:e2e) before Cloudflare sees it.
    #
    # cancel-in-progress is false so a deploy is never killed half way through
    # an upload. A pending job that a newer one replaces loses nothing: the
    # newer job builds a main that includes its commit.
    concurrency:
      group: deploy-site-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Say which commit is being deployed
        # The run is named after the commit that triggered it, which may be
        # older than what this job builds; this line is the record of what
        # actually shipped.
        run: echo "deploying main at $(git rev-parse HEAD) (run triggered by ${{ github.sha }})"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro 7 requires >=22.12.0 (site/package.json engines) — 20 would
          # fail the build outright.
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The player-sync and CLI-reference drift gates used to live here. They
      # have moved to deploy.yml's validate job, which runs on EVERY push and
      # pull request with no path filter — the only place that sees every change
      # to their Go-side inputs. Here they were doubly unreachable: this
      # workflow is path-filtered on `site/**`, and this job is additionally
      # gated `if: github.event_name != 'pull_request'`, so a CLI-help change
      # (which touches no site file and usually arrives BY pull request) could
      # never trip them. `npm run build` below still runs sync-site-assets via
      # its own `prebuild` hook, so a stale vendored player still cannot ship.
      - name: Corral dependencies
        working-directory: site
        run: npm ci
      - name: Saddle up Playwright's browser
        # test:e2e (below) drives a real Chromium against the built site —
        # the runner image ships no browsers, so without this step the herd
        # never gets out of the gate.
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Render the fixture ledger for the tests
        # The e2e suite must never depend on what the live record holds: every
        # fresh corral deployment starts with an EMPTY record, and the live
        # branch was itself restarted at a checkpoint on 2026-11-09. So the
        # tests build against a committed prefix of the archived chain, signed
        # by the key committed beside it.
        run: |
          CORRALAI_LEDGER_DIR=site/tests/fixtures/ledger-prefix \
          CORRALAI_LEDGER_PUBKEY="$(tr -d '[:space:]' < site/tests/fixtures/ledger-prefix/LEDGER_PUBKEY)" \
          bash scripts/gen-ledger-site.sh
      - name: Build + smoke-test the site
        working-directory: site
        run: npm run test:e2e
      - name: Render the live ledger record
        # The record lives on its own branch, which the checkout above does not
        # fetch, so pull it explicitly and render it into site/public/ledger
        # (copied verbatim into dist by Astro), replacing the fixture render.
        # Deliberately NOT guarded with `|| true`: a site that quietly ships
        # without the record looks identical to one whose record is empty, and
        # this project's whole argument is that those two must never render
        # the same.
        run: |
          git fetch --depth=1 origin corral/ledger
          # The deployed page checks corral's own record against the key the
          # repository publishes — passed EXPLICITLY, so the trust decision
          # lives here, in review, not inferred inside the renderer.
          test -s LEDGER_PUBKEY || { echo "LEDGER_PUBKEY is missing or empty — refusing to publish an unchecked ledger page" >&2; exit 1; }
          rm -rf site/public/ledger
          CORRALAI_LEDGER_PUBKEY="$(tr -d '[:space:]' < LEDGER_PUBKEY)" bash scripts/gen-ledger-site.sh
      - name: Build the site for deploy
        # test:e2e built dist from the fixture render; this rebuild is what
        # gets published, so dist carries the live record.
        working-directory: site
        run: npm run build
      - name: Deploy to Cloudflare Pages
        working-directory: site
        # Pinned to the wrangler 4 major (4.107.0 at authoring time) so a
        # future major release can't silently change pages-deploy flag
        # semantics without a reviewable diff here.
        run: npx wrangler@4 pages deploy dist --project-name=corralai-dev --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
