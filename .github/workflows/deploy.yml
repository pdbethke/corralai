name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    # Fast correctness gate on a GitHub-hosted runner: vet + the full test
    # suite (coordination, memory, principals, auth). Runs on PRs too so a
    # red build blocks the deploy and shows on the PR.
    #
    # `validate` is a REQUIRED status check, so this job must ALWAYS run to
    # completion — a skipped required check stays "pending" forever and blocks
    # every merge. So we never path-filter the job itself; instead we detect
    # whether anything but docs changed and skip only the heavy STEPS when it's
    # a Markdown-only change. Detection fails SAFE: anything it can't confidently
    # classify as docs-only runs the full build.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changed-file diff below is exact
      - name: Detect whether anything but docs changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF" || true
            base="$(git merge-base FETCH_HEAD HEAD 2>/dev/null || true)"
            [ -n "$base" ] && files="$(git diff --name-only "$base" HEAD 2>/dev/null || true)"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || true)"
          fi
          # Fail-safe: if we couldn't enumerate the diff, run the full build.
          if [ -z "$files" ]; then
            echo "changed files: <undetermined> — running full validate (fail-safe)"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"; printf '  %s\n' $files
          # Any changed file that is not Markdown -> run the full build.
          if printf '%s\n' "$files" | grep -qvE '(^$|\.md$)'; then
            code=true
          else
            code=false
          fi
          echo "non-docs changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: steps.filter.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - if: steps.filter.outputs.code == 'true'
        run: go vet ./...
      - name: Provision language test toolchains (audit gate)
        if: steps.filter.outputs.code == 'true'
        # Shared with .github/workflows/self-audit.yml, which runs this same
        # suite as the code UNDER AUDIT — the two must provision identically or
        # the audit grades a different suite than CI validates.
        run: bash scripts/ci-provision-test-toolchains.sh
      - name: Test, and census the SKIPs
        if: steps.filter.outputs.code == 'true'
        run: |
          # -v so this one run doubles as a skip census. Plain `go test ./...`
          # never prints SKIP markers, so a jail test that silently skips is
          # indistinguishable from one that passed — and a skipped jail test
          # proves nothing about the jail, which is what corral's whole audit
          # rests on. The count is the only way to see whether the bubblewrap
          # provisioning above actually took effect on this runner. -v changes
          # verbosity only, never pass/fail.
          set +e
          set -o pipefail
          go test ./... -v 2>&1 | tee /tmp/gotest.log
          rc=$?
          set -e
          count=$(grep -c -- '--- SKIP' /tmp/gotest.log || true)
          echo "::notice title=SKIP census::${count} test(s) skipped on this runner"
          if [ "$count" -gt 0 ]; then
            echo "skipped tests:"
            grep -- '--- SKIP' /tmp/gotest.log | sed 's/.*--- SKIP: /  /' | sort -u
          fi
          exit "$rc"
      - name: Check the CLI reference hasn't drifted from the real binaries
        if: steps.filter.outputs.code == 'true'
        # These two drift gates live HERE, in the always-on validate job, and
        # deliberately NOT in deploy-site.yml — because their inputs are
        # Go-side, so this is the only workflow that sees every change to them.
        # deploy-site.yml is path-filtered on `site/**` AND its drift steps sat
        # in a job gated `if: github.event_name != 'pull_request'`, so the
        # combination almost never fired: the `certify --repo` subcommand — the
        # whole repo-scan feature — silently vanished from the published CLI
        # reference for a week and only surfaced when someone happened to edit
        # the site. A gate that runs where its input CANNOT change is not a
        # gate. Generated by scripts/gen-cli-docs.sh from the binaries' own -h.
        run: bash scripts/gen-cli-docs.sh --check
      - name: Check the cost-model page's table hasn't drifted from its ledger fixture
        if: steps.filter.outputs.code == 'true'
        # Same reasoning as the CLI reference above: docs/design/cost-model.md's
        # per-phase table is generated from docs/design/fixtures/cost-model-flask.json
        # and cost-model-requests.json by scripts/gen-cost-table.sh, never hand-edited.
        run: bash scripts/gen-cost-table.sh --check
      - name: Check the site's vendored replay player hasn't drifted
        if: steps.filter.outputs.code == 'true'
        # Same reasoning: the source of truth is internal/ui/web/replay-player.js
        # (Go-side), and site/public/ carries a hash-synced copy.
        run: bash scripts/sync-site-assets.sh --check
      - name: Install gosec
        if: steps.filter.outputs.code == 'true'
        # PINNED, not @latest. An unpinned linter makes the gate
        # non-deterministic: a new gosec release turns CI red with zero code
        # changes, on a rule that did not exist when the code was written
        # (G703 taint analysis did exactly that here). Bump deliberately, so a
        # new rule is reviewed as a change rather than discovered as an outage.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      # check-security.sh runs govulncheck only when the binary is present, so
      # without this step the vulnerability scan silently did not run in CI at
      # all — the gate reported "all security invariants hold" having checked
      # gofmt and gosec and nothing else. It fired only on a developer machine
      # that happened to have it installed, which is where these advisories were
      # actually found. A gate that reports a pass it never measured is the
      # exact failure mode this project exists to catch.
      - name: Install govulncheck
        if: steps.filter.outputs.code == 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Security gate
        if: steps.filter.outputs.code == 'true'
        run: bash scripts/check-security.sh
      - name: Docs-only change — heavy checks skipped
        if: steps.filter.outputs.code != 'true'
        run: echo "Only Markdown changed — go vet/test + security gate skipped; validate passes."

  deploy:
    # Runs ON the deploy host (a self-hosted runner, as the deploy user), so it
    # updates the canonical clone + rebuilds + restarts in place — no SSH key
    # leaves the host. Skipped on PRs, and skipped for docs-only pushes to main
    # (nothing about the binary changed, so there's nothing to rebuild).
    needs: validate
    if: github.event_name != 'pull_request' && needs.validate.outputs.code == 'true'
    runs-on: [self-hosted, corralai]
    steps:
      - name: Build + restart the brain
        run: |
          set -euo pipefail
          export PATH=$PATH:/usr/local/go/bin
          cd ~/corralai
          echo "::group::pull"
          # --ff-only fails loudly if the box clone diverged (a local hot-fix),
          # instead of silently discarding it — keep a paper trail.
          git pull --ff-only
          git log -1 --oneline
          echo "::endgroup::"
          echo "::group::build (CGO/duckdb)"
          # Build to a staging file while the old binary keeps running (you
          # can't overwrite a running executable — ETXTBSY), then swap.
          CGO_ENABLED=1 go build -trimpath -o corral.new ./cmd/corral
          echo "::endgroup::"
          sudo systemctl stop corral
          mv -f corral.new corral
          sudo systemctl start corral
          echo "::group::health"
          # systemctl is-active lies for Restart=always units — probe HTTP.
          ok=0
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 http://127.0.0.1:9019/healthz >/dev/null; then
              echo "corral healthy after restart"; ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::corral failed /healthz after deploy"
            journalctl -u corral -n 40 --no-pager || true
            exit 1
          fi
          echo "::endgroup::"
