name: Deploy

# Least privilege: validate only reads the repo; the self-hosted deploy job
# builds and restarts a local service and never calls the GitHub API with an
# elevated token.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    # Fast correctness gate on a GitHub-hosted runner: vet + the full test
    # suite (coordination, memory, principals, auth). Runs on PRs too so a
    # red build blocks the deploy and shows on the PR.
    #
    # `validate` is a REQUIRED status check, so this job must ALWAYS run to
    # completion — a skipped required check stays "pending" forever and blocks
    # every merge. So we never path-filter the job itself; instead we detect
    # whether anything but docs changed and skip only the heavy STEPS when it's
    # a Markdown-only change. Detection fails SAFE: anything it can't confidently
    # classify as docs-only runs the full build.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history so the changed-file diff below is exact
      - name: Detect whether anything but docs changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF" || true
            base="$(git merge-base FETCH_HEAD HEAD 2>/dev/null || true)"
            [ -n "$base" ] && files="$(git diff --name-only "$base" HEAD 2>/dev/null || true)"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || true)"
          fi
          # Fail-safe: if we couldn't enumerate the diff, run the full build.
          if [ -z "$files" ]; then
            echo "changed files: <undetermined> — running full validate (fail-safe)"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"; printf '  %s\n' $files
          # Any changed file that is not Markdown -> run the full build.
          if printf '%s\n' "$files" | grep -qvE '(^$|\.md$)'; then
            code=true
          else
            code=false
          fi
          echo "non-docs changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # NOT gated on the docs-only filter: the documentation gates below are Go
      # tests, so they need a toolchain even when nothing but Markdown changed.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # THE DOCUMENTATION GATES ALWAYS RUN — no `if:`, deliberately.
      #
      # These assert that every `pdbethke/corralai@<ref>` in the repo names a
      # ref that resolves, and that none of them pins an older tag than the
      # newest one cut. They are Go tests, so the docs-only branch below used to
      # skip them: a Markdown-only pull request was exactly the pull request on
      # which the pin-freshness gate never ran. The gate was neither missing nor
      # ignored — it was structurally unreachable by the one class of change it
      # exists to police, and documentation drifted past two releases under it.
      #
      # The name selector is duplicated in cmd/corral/action_test.go's
      # docGateSelector, and TestDocsGatesRunOnDocsOnlyChanges asserts the two
      # agree AND that every doc-walking test is named to match — so neither
      # renaming a test nor deleting this step can quietly switch the gates off.
      #
      # fetch-depth: 0 above is load-bearing here: TestDocsPinTheNewestCutTag
      # compares against the newest tag in THIS clone and skips without tags.
      - name: Documentation gates (run on every change, docs-only included)
        run: go test ./cmd/corral/ -run '^TestDocs' -count=1
      # ALSO UNGATED, and for the same reason as the step above: this asserts
      # the SPDX header on every tracked .go file, but ALSO that LICENSE still
      # says Elastic 2.0, that NOTICE points at commercial licensing, and that
      # README.md no longer advertises MIT — three Markdown-shaped invariants a
      # docs-only change is exactly able to break.
      #
      # CONTRIBUTING.md has always said this "must exit 0". Nothing ran it, and
      # it was found RED on 47 tracked files. A licensing invariant that only a
      # contributor's discipline enforces is not enforced.
      - name: Licensing gate (run on every change, docs-only included)
        run: bash scripts/check-licensing.sh
      - if: steps.filter.outputs.code == 'true'
        run: go vet ./...
      - name: Provision language test toolchains (audit gate)
        if: steps.filter.outputs.code == 'true'
        # Shared with .github/workflows/self-audit.yml, which runs this same
        # suite as the code UNDER AUDIT — the two must provision identically or
        # the audit grades a different suite than CI validates.
        run: bash scripts/ci-provision-test-toolchains.sh
      # THE CONTAINER JAIL IS EXERCISED HERE, and it never was before.
      #
      # `--jail container` is what README offers macOS and Windows operators,
      # and CORRALAI_EXEC_IMAGE appeared nowhere in this directory — so the
      # backend's integration tests skipped on every run since they were
      # written. That is how it stayed COMPLETELY BROKEN until someone executed
      # it by hand: docker mounts --tmpfs noexec, Go compiles its test binary
      # into /tmp and execs it, and every `go test` inside the jail died.
      #
      # The stakes are in the test's own comment: an earlier permission bug
      # meant "every --jail container audit vacuously PASSED grading because
      # the compliant baseline itself never ran." A vacuous pass is the worst
      # thing this project can produce, and the test proving it fixed had never
      # executed in CI.
      #
      # ubuntu-latest ships docker, so the only cost is building a small image.
      - name: Provision the container-jail image
        if: steps.filter.outputs.code == 'true'
        run: |
          docker build -t corral-ci-jail -f - . <<'DOCKERFILE'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir pytest
          DOCKERFILE
      # A BACKEND THIS RARELY EXERCISED MUST EXPLAIN ITSELF WHEN IT FAILS.
      # The integration tests below report pass/fail without the container's
      # own stderr, which is fine for a regression gate and useless for a first
      # failure on a machine you cannot log into. This reproduces the exact
      # shape those tests use -- a 0755 workspace holding a 0644 file, bind
      # mounted at the same path, read under --cap-drop=ALL -- and prints what
      # the runtime actually says. It never fails the build; it is here so the
      # next person debugging this reads a reason instead of guessing at one.
      - name: Container jail environment (diagnostic, never fails)
        run: |
          set +e
          echo "host uid:gid = $(id -u):$(id -g)   umask=$(umask)"
          echo "TMPDIR=${TMPDIR:-<unset>}  RUNNER_TEMP=${RUNNER_TEMP:-<unset>}"
          docker version --format '  client={{.Client.Version}} server={{.Server.Version}}' 2>&1
          docker info --format '  rootless={{.SecurityOptions}}' 2>&1 | head -2
          w=$(mktemp -d); chmod 755 "$w"; echo hello > "$w/marker.txt"; chmod 644 "$w/marker.txt"
          echo "workspace: $(stat -c '%a %u:%g %n' "$w")"
          echo "file:      $(stat -c '%a %u:%g %n' "$w/marker.txt")"
          echo "-- as image default user (what the code does today):"
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --tmpfs /tmp:rw,exec,nosuid,nodev -v "$w:$w" -w "$w" \
            "$CORRALAI_EXEC_IMAGE" sh -c 'id; cat marker.txt' 2>&1 | sed 's/^/     /'
          echo "   exit=$?"
          echo "-- as the host uid:"
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,nosuid,nodev \
            -v "$w:$w" -w "$w" \
            "$CORRALAI_EXEC_IMAGE" sh -c 'id; cat marker.txt' 2>&1 | sed 's/^/     /'
          echo "   exit=$?"
          rm -rf "$w"
          exit 0
        env:
          CORRALAI_EXEC_IMAGE: corral-ci-jail
      - name: Exercise the container jail (the macOS/Windows path)
        if: steps.filter.outputs.code == 'true'
        env:
          CORRALAI_EXEC_IMAGE: corral-ci-jail
        # -run Container so this step's failure names the backend rather than
        # hiding inside the full suite below, and -count=1 so a cached result
        # can never stand in for a run that did not happen.
        run: go test ./internal/adequacy/ ./internal/sandbox/ -run Container -count=1 -v
      - name: Test, and census the SKIPs
        if: steps.filter.outputs.code == 'true'
        run: |
          # -v so this one run doubles as a skip census. Plain `go test ./...`
          # never prints SKIP markers, so a jail test that silently skips is
          # indistinguishable from one that passed — and a skipped jail test
          # proves nothing about the jail, which is what corral's whole audit
          # rests on. The count is the only way to see whether the bubblewrap
          # provisioning above actually took effect on this runner. -v changes
          # verbosity only, never pass/fail.
          set +e
          set -o pipefail
          go test ./... -v 2>&1 | tee /tmp/gotest.log
          rc=$?
          set -e
          count=$(grep -c -- '--- SKIP' /tmp/gotest.log || true)
          echo "::notice title=SKIP census::${count} test(s) skipped on this runner"
          if [ "$count" -gt 0 ]; then
            echo "skipped tests:"
            grep -- '--- SKIP' /tmp/gotest.log | sed 's/.*--- SKIP: /  /' | sort -u
          fi
          exit "$rc"
      - name: Check the CLI reference hasn't drifted from the real binaries
        if: steps.filter.outputs.code == 'true'
        # These two drift gates live HERE, in the always-on validate job, and
        # deliberately NOT in deploy-site.yml — because their inputs are
        # Go-side, so this is the only workflow that sees every change to them.
        # deploy-site.yml is path-filtered on `site/**` AND its drift steps sat
        # in a job gated `if: github.event_name != 'pull_request'`, so the
        # combination almost never fired: the `certify --repo` subcommand — the
        # whole repo-scan feature — silently vanished from the published CLI
        # reference for a week and only surfaced when someone happened to edit
        # the site. A gate that runs where its input CANNOT change is not a
        # gate. Generated by scripts/gen-cli-docs.sh from the binaries' own -h.
        run: bash scripts/gen-cli-docs.sh --check
      - name: Check the cost-model page's table hasn't drifted from its ledger fixture
        if: steps.filter.outputs.code == 'true'
        # Same reasoning as the CLI reference above: docs/design/cost-model.md's
        # per-phase table is generated from docs/design/fixtures/cost-model-flask.json
        # and cost-model-requests.json by scripts/gen-cost-table.sh, never hand-edited.
        run: bash scripts/gen-cost-table.sh --check
      - name: Check the site's vendored replay player hasn't drifted
        if: steps.filter.outputs.code == 'true'
        # Same reasoning: the source of truth is internal/ui/web/replay-player.js
        # (Go-side), and site/public/ carries a hash-synced copy.
        run: bash scripts/sync-site-assets.sh --check
      - name: Install gosec
        if: steps.filter.outputs.code == 'true'
        # PINNED, not @latest. An unpinned linter makes the gate
        # non-deterministic: a new gosec release turns CI red with zero code
        # changes, on a rule that did not exist when the code was written
        # (G703 taint analysis did exactly that here). Bump deliberately, so a
        # new rule is reviewed as a change rather than discovered as an outage.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      # check-security.sh runs govulncheck only when the binary is present, so
      # without this step the vulnerability scan silently did not run in CI at
      # all — the gate reported "all security invariants hold" having checked
      # gofmt and gosec and nothing else. It fired only on a developer machine
      # that happened to have it installed, which is where these advisories were
      # actually found. A gate that reports a pass it never measured is the
      # exact failure mode this project exists to catch.
      - name: Install govulncheck
        if: steps.filter.outputs.code == 'true'
        # PINNED, for the reason the gosec pin four lines up already argues:
        # an unpinned scanner makes the gate non-deterministic, and a new
        # advisory or detection turning CI red with zero code changes should
        # arrive as a reviewed bump, not as an outage. It sat at @latest
        # directly beneath that argument.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Security gate
        if: steps.filter.outputs.code == 'true'
        run: bash scripts/check-security.sh
      - name: Docs-only change — heavy checks skipped
        if: steps.filter.outputs.code != 'true'
        run: echo "Only Markdown changed — go vet/test + security gate skipped; validate passes."

  deploy:
    # Runs ON the deploy host (a self-hosted runner, as the deploy user), so it
    # updates the canonical clone + rebuilds + restarts in place — no SSH key
    # leaves the host. Skipped on PRs, and skipped for docs-only pushes to main
    # (nothing about the binary changed, so there's nothing to rebuild).
    needs: validate
    if: github.event_name != 'pull_request' && needs.validate.outputs.code == 'true'
    runs-on: [self-hosted, corralai]
    steps:
      - name: Build + restart the brain
        run: |
          set -euo pipefail
          export PATH=$PATH:/usr/local/go/bin
          cd ~/corralai
          echo "::group::pull"
          # --ff-only fails loudly if the box clone diverged (a local hot-fix),
          # instead of silently discarding it — keep a paper trail.
          git pull --ff-only
          git log -1 --oneline
          echo "::endgroup::"
          echo "::group::build (CGO/duckdb)"
          # Build to a staging file while the old binary keeps running (you
          # can't overwrite a running executable — ETXTBSY), then swap.
          CGO_ENABLED=1 go build -trimpath -o corral.new ./cmd/corral
          echo "::endgroup::"
          sudo systemctl stop corral
          mv -f corral.new corral
          sudo systemctl start corral
          echo "::group::health"
          # systemctl is-active lies for Restart=always units — probe HTTP.
          ok=0
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 http://127.0.0.1:9019/healthz >/dev/null; then
              echo "corral healthy after restart"; ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::corral failed /healthz after deploy"
            journalctl -u corral -n 40 --no-pager || true
            exit 1
          fi
          echo "::endgroup::"
