name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    # Fast correctness gate on a GitHub-hosted runner: vet + the full test
    # suite (coordination, memory, principals, auth). Runs on PRs too so a
    # red build blocks the deploy and shows on the PR.
    #
    # `validate` is a REQUIRED status check, so this job must ALWAYS run to
    # completion — a skipped required check stays "pending" forever and blocks
    # every merge. So we never path-filter the job itself; instead we detect
    # whether anything but docs changed and skip only the heavy STEPS when it's
    # a Markdown-only change. Detection fails SAFE: anything it can't confidently
    # classify as docs-only runs the full build.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changed-file diff below is exact
      - name: Detect whether anything but docs changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF" || true
            base="$(git merge-base FETCH_HEAD HEAD 2>/dev/null || true)"
            [ -n "$base" ] && files="$(git diff --name-only "$base" HEAD 2>/dev/null || true)"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || true)"
          fi
          # Fail-safe: if we couldn't enumerate the diff, run the full build.
          if [ -z "$files" ]; then
            echo "changed files: <undetermined> — running full validate (fail-safe)"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"; printf '  %s\n' $files
          # Any changed file that is not Markdown -> run the full build.
          if printf '%s\n' "$files" | grep -qvE '(^$|\.md$)'; then
            code=true
          else
            code=false
          fi
          echo "non-docs changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: steps.filter.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - if: steps.filter.outputs.code == 'true'
        run: go vet ./...
      - name: Refresh apt package lists
        if: steps.filter.outputs.code == 'true'
        # Some runner images ship with empty/stale apt lists, so a bare
        # `apt-get install` fails to find the package. Done once, up front, for
        # every provisioning step below.
        run: sudo apt-get update || true
      - name: Provision Python test toolchain (audit gate — python plugin)
        if: steps.filter.outputs.code == 'true'
        run: |
          sudo apt-get install -y python3-pytest || python3 -m pip install --break-system-packages --quiet pytest || true
          python3 -m pytest --version || echo "pytest not available — python-in-jail test will SKIP"
      - name: Provision Ruby test toolchain (audit gate — ruby plugin)
        if: steps.filter.outputs.code == 'true'
        run: |
          sudo apt-get install -y ruby ruby-rspec || true
          ruby --version || echo "ruby not available — ruby-in-jail test will SKIP"
      - name: Provision JS/TS test toolchain (audit gate — js/ts plugins)
        if: steps.filter.outputs.code == 'true'
        run: |
          node --version || echo "node missing — js/ts-in-jail tests will SKIP"
          sudo npm install -g typescript @types/node || npm install -g typescript @types/node || true
          tsc --version || echo "tsc not available — ts-in-jail test will SKIP"
      - name: Provision bubblewrap (audit gate — jail tests)
        if: steps.filter.outputs.code == 'true'
        run: |
          sudo apt-get install -y bubblewrap || true
          # Ubuntu 24.04 blocks unprivileged user namespaces, which is what
          # bwrap needs. Relaxing it here is what lets the jail tests run
          # instead of skipping; if it fails the tests skip as before.
          #
          # DELIBERATE SANDBOX WEAKENING, accepted for this ephemeral runner
          # only: this same job runs `go install …@latest`, so third-party code
          # executes on a host whose unprivileged-userns restriction is off.
          # The trade is knowingly made — a jail test that SKIPS silently
          # proves nothing about the jail, which is the thing corral's whole
          # audit rests on. Never apply this to a durable host.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version || echo "bwrap unavailable — jail tests will SKIP"
      - if: steps.filter.outputs.code == 'true'
        run: go test ./...
      - name: Install gosec
        if: steps.filter.outputs.code == 'true'
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Security gate
        if: steps.filter.outputs.code == 'true'
        run: bash scripts/check-security.sh
      - name: Docs-only change — heavy checks skipped
        if: steps.filter.outputs.code != 'true'
        run: echo "Only Markdown changed — go vet/test + security gate skipped; validate passes."

  deploy:
    # Runs ON the deploy host (a self-hosted runner, as the deploy user), so it
    # updates the canonical clone + rebuilds + restarts in place — no SSH key
    # leaves the host. Skipped on PRs, and skipped for docs-only pushes to main
    # (nothing about the binary changed, so there's nothing to rebuild).
    needs: validate
    if: github.event_name != 'pull_request' && needs.validate.outputs.code == 'true'
    runs-on: [self-hosted, corralai]
    steps:
      - name: Build + restart the brain
        run: |
          set -euo pipefail
          export PATH=$PATH:/usr/local/go/bin
          cd ~/corralai
          echo "::group::pull"
          # --ff-only fails loudly if the box clone diverged (a local hot-fix),
          # instead of silently discarding it — keep a paper trail.
          git pull --ff-only
          git log -1 --oneline
          echo "::endgroup::"
          echo "::group::build (CGO/duckdb)"
          # Build to a staging file while the old binary keeps running (you
          # can't overwrite a running executable — ETXTBSY), then swap.
          CGO_ENABLED=1 go build -trimpath -o corral.new ./cmd/corral
          echo "::endgroup::"
          sudo systemctl stop corral
          mv -f corral.new corral
          sudo systemctl start corral
          echo "::group::health"
          # systemctl is-active lies for Restart=always units — probe HTTP.
          ok=0
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 http://127.0.0.1:9019/healthz >/dev/null; then
              echo "corral healthy after restart"; ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::corral failed /healthz after deploy"
            journalctl -u corral -n 40 --no-pager || true
            exit 1
          fi
          echo "::endgroup::"
