name: Foreign sweep

# Least privilege: this job only clones foreign repos read-only and runs a
# dry-run audit — it never mutates this repo.
permissions:
  contents: read

# Runs scripts/foreign-sweep.sh — `certify --repo --dry-run` against 8
# SHA-pinned foreign repos producing 9 golden rows (express is scanned twice:
# once by convention, once with a tenant --tests map), diffed against
# testdata/foreign-sweep-expected.tsv (see that script's own header for why it
# exists and what it does and does not catch).
#
# A SEPARATE workflow from deploy.yml's `validate` job, deliberately: this
# job needs only network (git clone) + the Go toolchain — no model key, no
# jail, no bubblewrap, no per-language toolchain beyond Go, because
# --dry-run returns before any audit or suite execution. Folding it into
# `validate` would mean it inherits validate's much heavier provisioning
# (Python/Ruby/JS toolchains, bubblewrap, gosec) for no reason, and a
# required check that takes minutes to even START is a required check
# someone eventually disables. Kept as its own five-minute-budget job so
# there is never a reason to turn it off.
#
# Runs on PRs (not just pushes to main) — a gate that only fires after merge
# is a report, not a gate — and reuses deploy.yml's docs-only detection
# pattern so a Markdown-only PR doesn't pay for 7 clones + a Go build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    # The script's own header budgets this at ~10s wall clock locally plus
    # network for 7 clones; without an explicit cap a hung clone or a wedged
    # runner falls back to GitHub's 6-hour default, which is not a "stays
    # under five minutes" budget in any sense a reviewer would recognize.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history so the changed-file diff below is exact
      - name: Detect whether anything but docs changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF" || true
            base="$(git merge-base FETCH_HEAD HEAD 2>/dev/null || true)"
            [ -n "$base" ] && files="$(git diff --name-only "$base" HEAD 2>/dev/null || true)"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || true)"
          fi
          # Fail-safe: if we couldn't enumerate the diff, run the sweep.
          if [ -z "$files" ]; then
            echo "changed files: <undetermined> — running sweep (fail-safe)"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"; printf '  %s\n' $files
          # Any changed file that is not Markdown -> run the sweep.
          if printf '%s\n' "$files" | grep -qvE '(^$|\.md$)'; then
            code=true
          else
            code=false
          fi
          echo "non-docs changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.filter.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the foreign-repo enumeration sweep
        if: steps.filter.outputs.code == 'true'
        run: bash scripts/foreign-sweep.sh
      - name: Docs-only change — sweep skipped
        if: steps.filter.outputs.code != 'true'
        run: echo "Only Markdown changed — foreign-sweep skipped; sweep passes."
