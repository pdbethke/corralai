# SPDX-License-Identifier: Elastic-2.0
#
# Publish a GitHub Release whenever a version tag is pushed.
#
# This exists because the same mistake happened three times in one week: a tag
# was cut, the docs were updated to pin it, and no release was ever published —
# so the Releases page (the first thing a curious reader clicks) advertised an
# older build than the docs told people to install. Once it was the day-zero
# v0.1.0, seven weeks stale.
#
# Publishing by hand is a step that can be forgotten, and a step that can be
# forgotten eventually is. The tag is the intent; the release should follow from
# it rather than depend on someone remembering.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Annotated TAG OBJECTS, not just the refs. Without this the tag
          # resolves to its commit and `%(contents:subject)` silently returns
          # the COMMIT's subject — a plausible-looking wrong title rather than
          # an error. The first auto-published release was named after the
          # changelog commit that triggered it.
          fetch-tags: true

      # A RELEASE MUST SHIP A CONSOLE ITS CLIENTS CAN VERIFY, and until this
      # step existed none of them did.
      #
      # The manifest's Version field is part of the SIGNED bytes, and the only
      # committed signature covered "dev" — the version an unstamped build
      # reports. `go install ...@vX` resolves a real module version, so every
      # released brain served a manifest whose signature no client could check,
      # and corral-observe / corral-admin refused the bundle outright:
      #
      #   console: fetch UI bundle: console: manifest signature INVALID
      #
      # Nothing caught it because nothing ever ran scripts/sign-console-bundle.sh
      # outside a developer's shell. The signature must be COMMITTED AT THE TAG
      # (go install builds from source, so one produced here would arrive too
      # late), which makes this a VERIFICATION step: cut the tag from a commit
      # whose signature is already correct for that version.
      #
      # It fails the release rather than warning. A release that ships an
      # unverifiable console is discovered by an operator; a release that fails
      # to cut is discovered by the person cutting it.
      - name: Verify the console bundle is signed for THIS version
        env:
          CORRALAI_CONSOLE_PUBKEY: ${{ secrets.CORRALAI_CONSOLE_PUBKEY }}
        run: |
          set -euo pipefail
          if [ -z "${CORRALAI_CONSOLE_PUBKEY:-}" ]; then
            echo "::error::No CORRALAI_CONSOLE_PUBKEY secret. Every thin client needs a release public key to verify the console bundle against, and the only key this repository ships is a DEV key whose private half is committed (see internal/consolebundle). Generate a release keypair, keep the seed out of the repo, set the public half as this secret, and re-sign with CORRALAI_RELEASE_KEY=<seed> scripts/sign-console-bundle.sh <version> before tagging."
            exit 1
          fi
          go run ./cmd/verify-console-signature "${GITHUB_REF_NAME}"


      # Notes come from CHANGELOG.md's section for this exact version. A tag
      # with no changelog entry is a release nobody described, so it fails
      # rather than publishing an empty one — the point is that the page tells
      # a reader what changed.
      - name: Extract this version's changelog section
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section. A release with no notes is a page that tells a reader nothing — add the entry and re-tag." >&2
            exit 1
          fi
          # index(...)==1 is a LITERAL prefix match. `$0 ~ v` would treat the
          # heading as a regex, where "[v0.5.6]" is a character class rather
          # than the text — it matches nothing and the notes come out empty,
          # which is exactly what happened the first time this was written.
          awk -v v="## [${version}]" '
            index($0, v) == 1 {found=1; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::error::the '${version}' changelog section is empty." >&2
            exit 1
          fi
          echo "path=${RUNNER_TEMP}/notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          # The changelog heading carries a DATE, not a title, so the release
          # name comes from the annotated tag's own subject line — which is
          # where a one-line description of the release already lives.
          # Ask the API, not the checkout.
          #
          # Two git incantations were tried here and both returned the COMMIT's
          # subject on the runner — `git tag -l` and then `for-each-ref`, the
          # second added specifically to fix the first. Neither errored; both
          # produced a plausible wrong title, and two releases were published
          # named after whatever had just been merged. Whatever actions/checkout
          # leaves behind for a tag ref, it is not reliably the annotated
          # object, and guessing at it a third time is not a strategy.
          #
          # The API knows: the ref reports type "tag" for an annotated tag, and
          # the tag object carries the message. No dependence on how the
          # workspace was fetched.
          # The tag's commit must have GREEN CI. release.yml triggers on any
          # v* tag push with no dependency on the validate workflow, so a tag
          # placed on a commit whose checks are red — or never ran — published
          # a release regardless. Found by a cold review, 2026-09-08 (R9).
          tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${version}" -q .sha)"
          # THE TAG'S COMMIT, OR A DESCENDANT OF IT ON THE DEFAULT BRANCH.
          #
          # The first version of this check demanded green on the tag's own
          # commit, and that rule cannot be satisfied by this repository's own
          # release procedure: TestDocsNeverAdvertiseAnUncutActionTag forbids
          # bumping the pins before the tag exists, and TestDocsPinTheNewestCutTag
          # fails the moment it does — so the release-content commit is RED at
          # tag time, always, and stays red, because merging the pin bump makes
          # a NEW commit rather than re-running the old one's checks. Cutting
          # rc.12 into that gate is how it was found (2026-09-09).
          #
          # What is actually checkable, and is the claim worth making: this
          # code passed CI as part of the default branch. So green on the tag's
          # commit passes, and green on a default-branch commit that CONTAINS
          # the tag passes — a tag on a commit whose CI never ran, or that was
          # never merged, still fails.
          check_validate() {
            gh api "repos/${GITHUB_REPOSITORY}/commits/$1/check-runs" \
              -q '[.check_runs[] | select(.name=="validate")] | sort_by(.completed_at) | last | .conclusion' 2>/dev/null || echo ""
          }
          validate="$(check_validate "$tag_commit")"
          if [ "$validate" != "success" ]; then
            head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REPOSITORY##*/}" -q .sha 2>/dev/null || gh api "repos/${GITHUB_REPOSITORY}/branches/main" -q .commit.sha)"
            contains="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_commit}...${head_sha}" -q .status 2>/dev/null || echo "")"
            head_validate="$(check_validate "$head_sha")"
            if [ "$contains" != "ahead" ] && [ "$contains" != "identical" ]; then
              echo "::error::${version} points at ${tag_commit}, whose validate is '${validate:-missing}', and that commit is not an ancestor of main (compare says '${contains:-unknown}'). A release is a claim that this code passed CI on the default branch." >&2
              exit 1
            fi
            if [ "$head_validate" != "success" ]; then
              echo "::error::${version} points at ${tag_commit} (validate '${validate:-missing}') and main at ${head_sha} is '${head_validate:-missing}'. Neither is green, so there is no commit to stand behind this release. Fix main, then re-run this workflow." >&2
              exit 1
            fi
            echo "validate is green on main (${head_sha}), which contains ${tag_commit} — publishing"
          else
            echo "validate is green on ${tag_commit}"
          fi

          ref_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${version}" -q .object.type)"
          if [ "$ref_type" != "tag" ]; then
            echo "::error::${version} is a lightweight tag. Release titles come from the tag's own message — create it with 'git tag -a ${version} -m \"<one line>\"' so the release is named after the release rather than after whatever was merged last." >&2
            exit 1
          fi
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${version}" -q .object.sha)"
          title="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" -q .message | head -1)"
          if [ -z "$title" ]; then
            echo "::error::${version} has no annotated tag message. Tag with 'git tag -a' and a one-line subject — the release title comes from it, and falling back to the commit subject names releases after whatever happened to be merged last." >&2
            exit 1
          fi
          # A PRE-RELEASE tag must not be published as the latest stable
          # release. --latest was unconditional, so v1.0.0-rc.11 landed as
          # "Latest" while every earlier rc sat as "Pre-release" — the
          # Releases page, which the docs point at, presenting a release
          # CANDIDATE as the current release. Found twice on 2026-09-08: by
          # hand, and by a cold review of .github/workflows (R3).
          #
          # Semver: anything after a '-' in the version is a pre-release
          # identifier (v1.0.0-rc.11, v1.0.0-beta.1). A bare v1.0.0 is not.
          case "$version" in
            *-*) prerelease=1 ;;
            *)   prerelease=0 ;;
          esac
          if [ "$prerelease" = "1" ]; then
            echo "$version carries a pre-release identifier — publishing as a pre-release, not as latest."
            gh release create "$version" \
              --title "$title" \
              --notes-file "${{ steps.notes.outputs.path }}" \
              --prerelease \
              --verify-tag
          else
            gh release create "$version" \
              --title "$title" \
              --notes-file "${{ steps.notes.outputs.path }}" \
              --latest \
              --verify-tag
          fi
