# SBOM — generate a Software Bill of Materials (SPDX) on every main push and
# attach it to each published release. Part of corralai's "publish the evidence"
# supply-chain posture (SECURITY.md).
name: SBOM
on:
  push:
    branches: ["main"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM (SPDX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: corralai.spdx.json
          artifact-name: corralai.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-spdx
          path: corralai.spdx.json
          retention-days: 90

  # On a published release, also attach the SBOM to the release assets.
  attach-to-release:
    if: github.event_name == 'release'
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM asset to the release
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom-spdx
      - name: Attach SBOM to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: corralai.spdx.json
