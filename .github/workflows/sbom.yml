# SBOM — generate a Software Bill of Materials (SPDX) on every main push and
# attach it to each published release. Part of corralai's "publish the evidence"
# supply-chain posture (SECURITY.md).
name: SBOM
on:
  push:
    branches: ["main"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM (SPDX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: corralai.spdx.json
          artifact-name: corralai.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: corralai.spdx.json
          retention-days: 90

  # On a published release, also attach the SBOM to the release assets.
  #
  # NOTE, and it is load-bearing: releases cut by release.yml are created
  # with GITHUB_TOKEN, and GitHub does not start workflow runs from events a
  # GITHUB_TOKEN raised. So this job never fires for our own releases — it
  # fires only for a release published by hand through the UI or by a PAT.
  # It is kept because that path is real, and because deleting it would hide
  # the gap rather than close it; the SBOM is on every run as an artifact
  # regardless. Closing it properly means release.yml attaching the SBOM
  # itself, or a PAT, and neither is a launch-day change. Found by a cold
  # review, 2026-09-08 (R2).
  attach-to-release:
    if: github.event_name == 'release'
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM asset to the release
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-spdx
      - name: Attach SBOM to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: corralai.spdx.json
