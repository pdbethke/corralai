# Corral audits its own pull requests.
#
# The project's whole claim is that a suite passing is not evidence the suite
# would notice a bug. Shipping an Action that makes that claim while never
# running it on our own changes is the disease this project diagnoses, so this
# workflow exists to point corral at corral.
#
# It is deliberately NON-BLOCKING (`min-kill-rate` is unset, so a low kill rate
# reports rather than fails, and the job is continue-on-error). The reason is
# cost, not confidence: an audit costs roughly (mutants × the target's whole
# suite runtime) per file, corral's own suite is ~45s cold, and that puts a
# single audited file in the region of two hours on a 2-core runner. A required
# check that can take hours is not a merge gate anyone will keep. Making this
# blocking is a decision to take once there are real timings from real PRs on
# this workflow — not before.
name: Self-audit

# NEVER pull_request_target. It runs with secrets available to a workflow
# resolved from the BASE branch while checking out the PR's code — which is how
# a stranger's pull request gets to spend this repo's API key, and to read it.
# The `audit` label below would not save us: labels can be applied before the
# author pushes again. If a future edit is tempted to reach for
# pull_request_target because fork PRs skip, the correct answer is that fork
# PRs SHOULD skip.
on:
  pull_request:
    # `labeled` is what makes the opt-in below usable: without it, adding the
    # label to an open PR would not start anything.
    types: [opened, synchronize, reopened, labeled]
    # Only Go changes can move a kill rate. A docs PR would otherwise spend an
    # hour to print "NOTHING IN SCOPE".
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push mid-audit makes the running audit's verdict describe code that no
  # longer exists — and it would keep burning API spend to produce it.
  group: self-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # An audit is a real bill — hours of runner time and hours of model calls —
    # so it never starts on its own. Two independent conditions, both required:
    #
    #   1. The PR comes from a branch in THIS repository, not a fork. GitHub
    #      already withholds secrets from fork PRs, so a fork audit would skip
    #      anyway — but that is a platform default doing the work silently, and
    #      it reads as "we forgot" rather than "we decided". Saying it here
    #      means a stranger's pull request cannot spend this repo's money, and
    #      the next person to read the file can see that is deliberate.
    #
    #   2. Someone applied the `audit` label. Opt-in per pull request, so no PR
    #      — including our own — quietly starts a two-hour paid job just by
    #      existing. `workflow_dispatch` is the manual door for the same thing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'audit'))
    runs-on: ubuntu-latest
    # Reporting a verdict is the point; blocking the merge is not (yet). A red
    # X here must not read as "this PR is broken".
    continue-on-error: true
    # GitHub's ceiling for one job. The audit below is told to use nearly all
    # of it, on purpose — see `timeout`.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The action derives its own --diff-base from the PR's base ref and
          # asks git for the merge base. A shallow clone has no merge base to
          # find, and the audit would silently widen to the whole repo.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # `go test ./...` is the suite UNDER AUDIT here, so it has to be able to
      # PASS on this runner before corral can grade anything against it. On a
      # bare runner it cannot: corral's own suite exercises each internal/lang
      # plugin against the real tool, and without pytest the adequacy tests fail
      # outright — the first real audit of this repo reported
      # `COULD-NOT-GRADE … ungradable: 1 (baseline-failed)` for exactly that
      # reason. Same script deploy.yml's validate job uses, so the audit grades
      # the same suite CI validates rather than a degraded one.
      - name: Provision language test toolchains
        run: bash scripts/ci-provision-test-toolchains.sh

      # The audit needs a model key. Without one it would fail deep inside the
      # run, after the checkout and the toolchain setup, with an error about a
      # provider rather than about configuration. Say so up front, and skip
      # rather than fail: a PR from a fork never gets the secret, and that is
      # not the contributor's mistake to look at.
      - id: key
        env:
          MODEL_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${MODEL_KEY:-}" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the self-audit: no GEMINI_API_KEY secret is available (expected on pull requests from forks). Add the secret in Settings → Secrets → Actions to enable it."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.have == 'true'
        uses: ./
        with:
          # Audit with the corral of the commit we CHECKED OUT, not whatever
          # `@main` resolves to. Left unpinned, `uses: ./` installs corral@main
          # from the Go module proxy, which caches a branch head for minutes —
          # so a run started just after a merge silently audits with the
          # PREVIOUS corral. That is not only a flake: on a pull request the
          # whole point is to exercise the corral in that PR, and @main is by
          # definition not it. head.sha is the PR branch's own commit (fork PRs
          # never reach here — see the job's `if:`); github.sha covers
          # workflow_dispatch, where it is the branch head.
          corral-version: ${{ github.event.pull_request.head.sha || github.sha }}
          test-command: "go test ./..."
          # The ceiling on what one PR can cost. corral's own default is 25
          # candidates, which at ~2h each is a job nobody meant to start; the
          # diff already narrows the candidate set, and this bounds what is
          # left. Raise it only alongside a real measurement of what a run
          # here actually takes.
          top: "1"
          # The WHOLE audit of that one file, not a bounded sample. corral's
          # 10m default is a guardrail for a PR author who did not choose to
          # start an hours-long job; this workflow chose to. On 2026-08-28
          # churn-x-size picked cmd/corral/certify_repo.go, every mutant
          # re-ran `go test ./...` (66s of it is cmd/corral alone, on 24
          # cores; a hosted runner has 4), and the 10m ceiling fell before a
          # single mutant scored: COULD-NOT-GRADE, no number. A run that
          # still hits THIS ceiling banks a [TIMED OUT] verdict once the dev
          # suite has scored — a real number, disclosed as non-converged —
          # instead of nothing. Sized just under timeout-minutes so corral's
          # own signed timeout verdict lands before GitHub kills the job.
          timeout: "340m"
          # All-Gemini on gemini-3.6-flash, because that is the configuration
          # this project actually has evidence for: five paid flask replicates,
          # ProvenMissed non-zero in every one. corral's own defaults are
          # claude-* — coherent, but never the thing that was measured. Cost
          # points the same way, and at hours per audited file the per-call
          # price is not a rounding error.
          #
          # A key alone would not have moved providers: the model NAMES would
          # still be Claude ones pointed at Google's endpoint.
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          derive-model: gemini-3.6-flash
          # The writer seat is the one place flash has been measured to fall
          # short on THIS repo: the first full self-audit (run 33226112930)
          # found 11 survivors in cmd/corral/certify_repo.go and gemini-3.6-flash
          # could not produce a compiling Go test in three attempts
          # ("encoding/json" imported and not used) — [WRITER FAILED], 0
          # proven. The same model proved 17 Python gaps on requests the next
          # day. The self-audit is Go, so its writer was pinned to a stronger
          # model — but the name chosen, gemini-3.6-pro, HAS NEVER EXISTED:
          # the served >=3.6 line is flash only (3.6-flash, 3.7-flash); the pro
          # line stops at 3.1-pro-preview. It was pattern-matched from
          # "3.6-flash exists, so 3.6-pro must", never checked against the API,
          # and never executed (this workflow runs only on the `audit` label or
          # a manual dispatch), so it sat wrong for two days and then burned two
          # hours of runner time before failing 404 at the writer seat.
          #
          # gemini-3.7-flash is the newest served model at or above the floor.
          # BE HONEST ABOUT WHAT THIS DOES NOT FIX: the reason for reaching past
          # flash — flash failing three times to write a compiling Go test — is
          # NOT addressed by another flash. If this run reports [WRITER FAILED]
          # again, the answer is a cross-vendor writer (the action already takes
          # anthropic-key), which needs that secret added. The run will say.
          # Same
          # key, a few more cents per run, and the seat that decides whether a
          # survivor becomes a PROVEN gap gets the model that can write the
          # language. Generator and deriver stay on flash — measured fine.
          writer-model: gemini-3.7-flash
          mutant-model: gemini-3.6-flash
          # Off because that is what the five replicates actually ran, not
          # because it has to be. CheckDecorrelation compares MODEL NAMES, not
          # vendors, so `critic-model: gemini-3.7-flash` would satisfy it on this
          # one key — and a second provider key here (they are additive) would
          # give a genuinely cross-vendor critic. Both are untested from this
          # workflow; the critic is advisory and never gates the verdict, so
          # this stays on the measured configuration until there is a reason
          # and a measurement to move it.
          critic-model: "off"
          # The challenger seat is OFF unless named. It used to default to a
          # CLAUDE model and be ON, so without this an "all-Gemini" run still
          # contained an Anthropic seat and refused for want of a key it was
          # never given. Kept explicit here so this stays true regardless.
          # It only records a comparison and never gates the verdict.
          shadow-model: "off"
