name: "Corral adversarial test audit"
description: "Breaks your code to check whether your tests notice. Runs in your own CI, on the checkout that is already there."
inputs:
  test-command:
    description: "The command that runs your tests, as a single-line invocation (e.g. 'go test ./...', 'pytest -k \"not slow\"'). Quoting is honoured; pipes, &&/||, redirection and globs are not. It must not contain a flag spelled the same as one of corral's own (--min-kill-rate, --preflight, --record, --substrate, --diff-base, --top): corral refuses with exit 2 rather than silently swallowing it, because a swallowed --min-kill-rate is a merge gate that never runs. Cypress's --record is the live collision; wrap such a command in a script."
    required: true
  diff-base:
    description: "Audit only files changed against this ref. Defaults to the PR base; set empty to audit the whole repo (expensive)."
    required: false
    default: ""
  goals:
    description: "Optional JSON file of per-file goals. Omitted means goals are derived by a model."
    required: false
    default: ""
  tests:
    description: "Optional JSON file mapping repo-relative SOURCE paths to their test files, consulted before filename convention. Needed whenever your project names tests after behaviour rather than after source files — common in JS/TS, where convention can pair NOTHING and the gate would then have no file to audit. A mapping to a file that does not exist is refused rather than silently ignored."
    required: false
    default: ""
  min-kill-rate:
    description: "Fail the run if any audited file's kill rate is below this value (0.0-1.0 inclusive, a minimum so a file exactly at the value passes). Applies PER FILE, not to the aggregate. Opt-in: leave empty (the default) to keep today's behaviour, where the run does not fail on a low kill rate."
    required: false
    default: ""
  top:
    description: "Audit at most this many of the highest-ranked candidate files, as a ceiling on what one run can cost. An audit costs roughly (mutants × your suite's whole runtime) PER FILE, and the file count comes from the PR's diff — a number the author picks, not you. On a repo whose suite takes a minute, a ten-file PR is a job measured in tens of hours, discovered only once it is running. Leave empty to keep corral's own default bound."
    required: false
    default: ""
  model-key:
    description: "Provider API key for the models corral runs. Required unless 'goals' is supplied AND every role's model is already reachable some other way. Pass it as a secret (e.g. ${{ secrets.GEMINI_API_KEY }}); never write a key inline in a workflow."
    required: false
    default: ""
  model-key-env:
    description: "Which environment variable 'model-key' becomes, so the key can reach a provider other than Anthropic. These are corral's own credential names: GEMINI_API_KEY (falling back to GOOGLE_API_KEY, then OPENAI_API_KEY), OPENAI_API_KEY, or ANTHROPIC_API_KEY. Must be a plain environment variable name; anything else is refused rather than exported. Defaults to ANTHROPIC_API_KEY, which matches corral's own default models."
    required: false
    default: "ANTHROPIC_API_KEY"
  derive-model:
    description: "Model that derives a goal per file when 'goals' is not supplied. Leave empty to keep corral's default. Setting a key alone is NOT enough to move providers: the model NAMES are corral's defaults (claude-*), and a Claude name pointed at another vendor's endpoint fails there."
    required: false
    default: ""
  writer-model:
    description: "Model for the test-writer role — the half that authors a test to prove a survivor is a real gap. Leave empty for corral's default."
    required: false
    default: ""
  mutant-model:
    description: "Model for the mutant-generator role. Leave empty for corral's default."
    required: false
    default: ""
  critic-model:
    description: "Model for the test-critic role, which must DIFFER from the writer's. 'off' disables the critic entirely — it is advisory and never gates the verdict, so a single-vendor run with only one usable model can drop it. Leave empty for corral's default."
    required: false
    default: ""
  corral-version:
    description: "Which corral to install, as a `go install .../cmd/corral@<ref>` version (a tag, branch, or commit). Defaults to the ref this action itself was resolved at, so the installed binary always matches the action."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install corral
      shell: bash
      env:
        CORRAL_VERSION: ${{ inputs.corral-version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        if ! command -v go >/dev/null 2>&1; then
          echo "::error::corral requires a Go toolchain on the runner (it is installed via 'go install', not vendored). Add the 'actions/setup-go' action before this step, or otherwise put a 'go' binary on PATH." >&2
          exit 1
        fi
        ref="$CORRAL_VERSION"
        if [ -z "$ref" ]; then
          ref="$ACTION_REF"
        fi
        if [ -z "$ref" ]; then
          # github.action_ref is empty for a local `uses: ./` reference
          # (e.g. this repo's own CI checking out this action). There is no
          # ref to match in that case, so fall back to main.
          ref="main"
          echo "::warning::github.action_ref was empty (a local 'uses: ./' reference); installing corral@main instead of matching a resolved ref."
        fi
        gobin="${RUNNER_TEMP:-/tmp}/corral-gobin"
        mkdir -p "$gobin"
        echo "Installing corral@${ref} into ${gobin}"
        GOBIN="$gobin" go install "github.com/pdbethke/corralai/cmd/corral@${ref}"
        echo "$gobin" >> "$GITHUB_PATH"
    - name: Run corral
      shell: bash
      env:
        MODEL_KEY: ${{ inputs.model-key }}
        MODEL_KEY_ENV: ${{ inputs.model-key-env }}
        DERIVE_MODEL: ${{ inputs.derive-model }}
        WRITER_MODEL: ${{ inputs.writer-model }}
        MUTANT_MODEL: ${{ inputs.mutant-model }}
        CRITIC_MODEL: ${{ inputs.critic-model }}
        DIFF_BASE: ${{ inputs.diff-base }}
        GOALS: ${{ inputs.goals }}
        TESTS: ${{ inputs.tests }}
        MIN_KILL_RATE: ${{ inputs.min-kill-rate }}
        TOP: ${{ inputs.top }}
        REPO_OWNER: ${{ github.repository_owner }}
        COMMIT_SHA: ${{ github.sha }}
        TEST_COMMAND: ${{ inputs.test-command }}
      run: |
        set -euo pipefail
        # The key is wired into the run under the name corral's credential
        # resolution actually reads (internal/agentbackend): GEMINI_API_KEY —
        # which itself falls back to GOOGLE_API_KEY then OPENAI_API_KEY —
        # OPENAI_API_KEY, or ANTHROPIC_API_KEY. It was hardwired to
        # ANTHROPIC_API_KEY, which is coherent with corral's default models but
        # made Anthropic the only provider reachable through this action.
        #
        # Exported under a computed name rather than declared in `env:` above,
        # because the name is the input. It is validated first: an env-var
        # assignment is `NAME=VALUE`, so a "name" containing an `=` would
        # smuggle a second assignment into the export, and a name with a shell
        # metacharacter has no legitimate use here at all. Refuse rather than
        # export something unintended.
        key_env="${MODEL_KEY_ENV:-ANTHROPIC_API_KEY}"
        if ! printf '%s' "$key_env" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*$'; then
          echo "::error::model-key-env must be a plain environment variable name (letters, digits and underscore, not starting with a digit) — got something else, which will not be exported. Use one of corral's credential names: GEMINI_API_KEY, GOOGLE_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY." >&2
          exit 1
        fi
        # Never echoed: a job log is readable by anyone who can see the run.
        export "$key_env=${MODEL_KEY:-}"

        base="$DIFF_BASE"
        if [ -z "$base" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          base="origin/$GITHUB_BASE_REF"
        fi
        # The record this run publishes must name what it audited: --owner and
        # --commit are what the report header ("Repo adequacy — owner/repo @
        # commit") is built from, and GitHub already knows both. --repo takes
        # the workspace path rather than "."; the repo NAME in the header is
        # that path's basename, and "." names nothing.
        args=(certify --repo "${GITHUB_WORKSPACE:-.}" --substrate workspace)
        args+=(--owner "$REPO_OWNER" --commit "$COMMIT_SHA")
        [ -n "$base" ] && args+=(--diff-base "$base")
        [ -n "$GOALS" ] && args+=(--goals "$GOALS")
        [ -n "${TESTS:-}" ] && args+=(--tests "$TESTS")
        [ -n "$MIN_KILL_RATE" ] && args+=(--min-kill-rate "$MIN_KILL_RATE")
        [ -n "${TOP:-}" ] && args+=(--top "$TOP")
        # Role→model routing. Each is omitted when empty so corral keeps
        # ownership of its own defaults — the action must never become a second
        # place where a default model is decided.
        [ -n "${DERIVE_MODEL:-}" ] && args+=(--derive-model "$DERIVE_MODEL")
        [ -n "${WRITER_MODEL:-}" ] && args+=(--writer-model "$WRITER_MODEL")
        [ -n "${MUTANT_MODEL:-}" ] && args+=(--mutant-model "$MUTANT_MODEL")
        [ -n "${CRITIC_MODEL:-}" ] && args+=(--critic-model "$CRITIC_MODEL")
        # $TEST_COMMAND is data, not script: it is split into argv words the
        # way a real shell's own parser would (so "go test ./..." becomes
        # three args, and pytest -k "not slow" keeps "not slow" as one),
        # but it is never handed to bash for evaluation, so shell
        # metacharacters (;, backticks, $( )) in it cannot execute.
        #
        # A YAML block scalar (test-command: |) can carry an embedded
        # newline; silently keeping only the first line would grade a
        # different, truncated command than the one written, so reject it
        # instead.
        if [[ "$TEST_COMMAND" == *$'\n'* ]]; then
          echo "::error::test-command must be a single line — a multi-line value (e.g. from a YAML block scalar) would be silently truncated to its first line rather than run in full." >&2
          exit 1
        fi
        # GitHub does not actually enforce `required: true`, and an empty
        # value can also arrive through a reusable workflow. Reject it here
        # rather than letting it become a one-element argv holding "" below
        # (GNU xargs still runs its command once on empty input without
        # -r): corral would treat that as an explicit, empty test command
        # and try to exec it — every candidate fails its baseline for an
        # opaque reason, the same undiagnosable shape the newline check
        # above exists to prevent, arriving through a different door.
        if [[ -z "${TEST_COMMAND//[[:space:]]/}" ]]; then
          echo "::error::test-command is empty (or whitespace-only). It is required — corral will not silently fall back to a guessed test command." >&2
          exit 1
        fi
        # xargs does its own shell-style quote parsing (single and double
        # quotes are honoured) WITHOUT being a shell: it never evaluates
        # $( ), backticks, ;, &&, redirection, or globs, and -d is
        # deliberately not passed on the INPUT side since that disables the
        # quote handling this depends on. An unmatched quote makes xargs
        # fail, which must surface as an error, not an empty or partial
        # argv — checked here as its own pass (before the parse below)
        # since the parse's own pipeline exit status is not reliably
        # observable once it feeds a NUL-delimited `mapfile` via process
        # substitution.
        if ! printf '%s\n' "$TEST_COMMAND" | xargs -r -n1 printf '%s\0' >/dev/null; then
          echo "::error::test-command could not be parsed as shell-style words (check for an unmatched quote): $TEST_COMMAND" >&2
          exit 1
        fi
        # The actual split: NUL-delimited output, read with `mapfile -d ''`,
        # so a trailing empty argument (`pytest ""`, or `pytest -k ""`)
        # survives — `$( )` command substitution strips trailing newlines,
        # which would otherwise silently drop exactly that argument. The
        # trailing `\n` fed to xargs above is required too: without it, GNU
        # xargs drops a trailing empty-quoted argument outright rather than
        # emitting it as a zero-length one.
        mapfile -d '' TEST_ARGV < <(printf '%s\n' "$TEST_COMMAND" | xargs -r -n1 printf '%s\0')
        # The load-bearing guard is HERE, over the parsed OUTPUT, not the
        # input string above — and it checks the actual invariant corral
        # needs, not a shape of the input. What makes an argv usable as a
        # command is simply: there is at least one word, and the FIRST one
        # (the program name corral will exec) is not empty. That is the
        # whole property; an empty argument ANYWHERE ELSE is completely
        # legitimate (`pytest ""`, `pytest -k ""`) and must not trip this.
        # A check phrased as a shape of the input ("is it whitespace?", "is
        # the argv exactly one empty element?") only ever catches the
        # shapes already seen; checking argv[0] directly catches every
        # shape that can produce an unusable command, including ones not
        # yet constructed.
        if [ "${#TEST_ARGV[@]}" -eq 0 ] || [ -z "${TEST_ARGV[0]}" ]; then
          echo "::error::test-command has no command to run (the program name is empty or missing). It is required — corral will not silently fall back to a guessed test command." >&2
          exit 1
        fi
        # corral's report IS the product — the kill rate, the survivors, and
        # the honesty lines (NOT AUDITED / DID NOT FINISH / WRITER FAILED /
        # TEST UNSOUND) that say what a number does and does not mean. On a
        # runner, stdout is a collapsed job log nobody opens, so a run that
        # proved a real gap and a run that found nothing look identical from
        # the PR page. Mirror the report into the job summary, where it is the
        # first thing visible on the run.
        #
        # $GITHUB_STEP_SUMMARY rather than a PR comment, deliberately: it needs
        # no `permissions:` block, it works on fork PRs (where a comment token
        # does not exist), and re-runs replace it instead of stacking up.
        #
        # The report is reproduced VERBATIM. Re-rendering it here would be a
        # second renderer, free to drift from printRepoReport — and drift in a
        # summary always flatters the run, because the lines that get lost are
        # the qualifying ones.
        report="${RUNNER_TEMP:-/tmp}/corral-report.txt"
        status=0
        # `set -o pipefail` is on (top of this script), so the pipeline's
        # status is corral's, not tee's. Without it the status would be tee's,
        # which is 0 essentially always: a --min-kill-rate failure — the entire
        # merge gate — would exit 0 and the PR would go green on exactly the
        # change the gate was installed to block. `|| status=$?` is what keeps
        # `set -e` from taking the script down before the summary is written;
        # the status is re-raised at the end, unchanged.
        corral "${args[@]}" -- "${TEST_ARGV[@]}" | tee "$report" || status=$?

        # Reporting is a side channel: it must never be the reason an audit
        # fails. $GITHUB_STEP_SUMMARY is set by the Actions runner and by
        # nothing else, so it is legitimately absent under `act`, on some
        # self-hosted setups, and when this script is run directly.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$report" ]; then
          # GitHub rejects a summary over 1MiB OUTRIGHT — an unbounded write
          # loses the whole report, not just its tail. Bound it, keeping the
          # HEAD (the verdict line is the first thing printed), and say so
          # where it was cut: a silently truncated report reads exactly like a
          # short one, and this action already refuses to silently truncate a
          # multi-line test-command for the same reason.
          limit=900000
          size=$(wc -c < "$report")
          # A fixed ``` fence is closed early by any line in the report that
          # itself begins with three backticks, after which the remainder
          # renders as markdown and the preformatted layout (the indentation
          # of the weakest-files list is load-bearing) is lost. Grow the fence
          # past the longest backtick run the report actually contains.
          longest=$( { grep -o '`\+' "$report" || true; } | awk '{ if (length($0) > n) n = length($0) } END { print n+0 }' )
          fence='```'
          while [ "${#fence}" -le "$longest" ]; do
            fence="${fence}\`"
          done
          {
            echo "## Corral — adversarial test audit"
            echo
            echo "$fence"
            head -c "$limit" "$report"
            # head -c can stop mid-line; without this the closing fence would
            # be appended to that partial line and never open its own.
            echo
            echo "$fence"
            if [ "$size" -gt "$limit" ]; then
              echo
              echo "_Report truncated at ${limit} of ${size} bytes to stay under GitHub's 1MiB step-summary limit. The full report is in this step's log._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit "$status"
