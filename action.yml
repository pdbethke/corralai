name: "Corral adversarial test audit"
description: "Breaks your code to check whether your tests notice. Runs in your own CI, on the checkout that is already there."
inputs:
  test-command:
    description: "The command that runs your tests, exactly as your CI runs it (e.g. 'go test ./...')."
    required: true
  diff-base:
    description: "Audit only files changed against this ref. Defaults to the PR base; set empty to audit the whole repo (expensive)."
    required: false
    default: ""
  goals:
    description: "Optional JSON file of per-file goals. Omitted means goals are derived by a model."
    required: false
    default: ""
  model-key:
    description: "Provider API key for goal derivation. Required unless 'goals' is supplied."
    required: false
    default: ""
  corral-version:
    description: "Which corral to install, as a `go install .../cmd/corral@<ref>` version (a tag, branch, or commit). Defaults to the ref this action itself was resolved at, so the installed binary always matches the action."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install corral
      shell: bash
      env:
        CORRAL_VERSION: ${{ inputs.corral-version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        if ! command -v go >/dev/null 2>&1; then
          echo "::error::corral requires a Go toolchain on the runner (it is installed via 'go install', not vendored). Add the 'actions/setup-go' action before this step, or otherwise put a 'go' binary on PATH." >&2
          exit 1
        fi
        ref="$CORRAL_VERSION"
        if [ -z "$ref" ]; then
          ref="$ACTION_REF"
        fi
        if [ -z "$ref" ]; then
          # github.action_ref is empty for a local `uses: ./` reference
          # (e.g. this repo's own CI checking out this action). There is no
          # ref to match in that case, so fall back to main.
          ref="main"
          echo "::warning::github.action_ref was empty (a local 'uses: ./' reference); installing corral@main instead of matching a resolved ref."
        fi
        gobin="${RUNNER_TEMP:-/tmp}/corral-gobin"
        mkdir -p "$gobin"
        echo "Installing corral@${ref} into ${gobin}"
        GOBIN="$gobin" go install "github.com/pdbethke/corralai/cmd/corral@${ref}"
        echo "$gobin" >> "$GITHUB_PATH"
    - name: Run corral
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.model-key }}
      run: |
        set -euo pipefail
        base="${{ inputs.diff-base }}"
        if [ -z "$base" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          base="origin/$GITHUB_BASE_REF"
        fi
        # The record this run publishes must name what it audited: --owner and
        # --commit are what the report header ("Repo adequacy — owner/repo @
        # commit") is built from, and GitHub already knows both. --repo takes
        # the workspace path rather than "."; the repo NAME in the header is
        # that path's basename, and "." names nothing.
        args=(certify --repo "${GITHUB_WORKSPACE:-.}" --substrate workspace)
        args+=(--owner "${{ github.repository_owner }}" --commit "${{ github.sha }}")
        [ -n "$base" ] && args+=(--diff-base "$base")
        [ -n "${{ inputs.goals }}" ] && args+=(--goals "${{ inputs.goals }}")
        corral "${args[@]}" -- ${{ inputs.test-command }}
