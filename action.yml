name: "Corral adversarial test audit"
description: "Breaks your code to check whether your tests notice. Runs in your own CI, on the checkout that is already there."
inputs:
  test-command:
    description: "The command that runs your tests, as a single-line invocation (e.g. 'go test ./...', 'pytest -k \"not slow\"'). Quoting is honoured; pipes, &&/||, redirection and globs are not. It must not contain a flag spelled the same as one of corral's own (--min-kill-rate, --preflight, --record, --substrate, --diff-base, --top): corral refuses with exit 2 rather than silently swallowing it, because a swallowed --min-kill-rate is a merge gate that never runs. Cypress's --record is the live collision; wrap such a command in a script."
    required: true
  diff-base:
    description: "Audit only files changed against this ref. Defaults to the PR base; set empty to audit the whole repo (expensive)."
    required: false
    default: ""
  goals:
    description: "Optional JSON file of per-file goals. Omitted means goals are derived by a model."
    required: false
    default: ""
  tests:
    description: "Optional JSON file mapping repo-relative SOURCE paths to their test files, consulted before filename convention. Needed whenever your project names tests after behaviour rather than after source files — common in JS/TS, where convention can pair NOTHING and the gate would then have no file to audit. A mapping to a file that does not exist is refused rather than silently ignored."
    required: false
    default: ""
  min-kill-rate:
    description: "Fail the run if any audited file's kill rate is below this value (0.0-1.0 inclusive, a minimum so a file exactly at the value passes). Applies PER FILE, not to the aggregate. Opt-in: leave empty (the default) to keep today's behaviour, where the run does not fail on a low kill rate."
    required: false
    default: ""
  push:
    description: "Append this run's per-file verdicts to a DuckDB YOU own — a path, or 'md:<db>' for MotherDuck. corral has no hosted tier and keeps nothing: your key, your runner, your warehouse, and any DuckDB works. Append-only. Every row carries the local scan ledger's row id (0, since this Action does not enable corral's own --record) plus the run URL, and — traceable only when 'attest' is also set — the sha256 of the signed statement it came from, so a row can be checked against something verifiable; without 'attest', statement_sha256 is honestly empty rather than fabricated. This is what answers the question one pull request cannot: a single kill rate is a sample — the same unchanged diff has scored 0.85 and 0.90 — while forty of them are a distribution you can read a trend from. For MotherDuck, also set 'motherduck-token'."
    required: false
    default: ""
  motherduck-token:
    description: "MotherDuck token, exported as motherduck_token for a 'md:<db>' push target. Pass as a secret; never inline. Not needed for a local DuckDB path."
    required: false
    default: ""
  attest:
    description: "Write the scan's verdict as an in-toto Statement and publish it as a GitHub artifact attestation — the receipt a reviewer can verify WITHOUT trusting the run that produced it (`gh attestation verify`). Off by default; set to 'true' to enable. Requires `permissions: { id-token: write, attestations: write, contents: read }` in the calling workflow, and works on public repositories at no cost. Signing is keyless, through the workflow's own OIDC identity, so the signature chains to the repository and workflow rather than to a key that lived on an ephemeral runner."
    required: false
    default: ""
  max-proven-missed:
    description: "Fail the run if any audited file has MORE than this many PROVEN-MISSED gaps — survivors the herd then killed with a test it wrote and ran. Opt-in; leave empty for today's behaviour. Prefer this to min-kill-rate as the merge gate. A kill rate is a proportion of freshly generated mutants and moves between runs on unchanged code, so a threshold near a healthy value flaps red on good work and gets switched off; a proven gap is a specific demonstrated bug your tests miss, established by execution. '0' means any demonstrated gap fails the build. It fails CLOSED when the herd had survivors but could author no test that graded — a zero there means nothing was proven, not that the suite is clean."
    required: false
    default: ""
  top:
    description: "Audit at most this many of the highest-ranked candidate files, as a ceiling on what one run can cost. An audit costs roughly (mutants × your suite's whole runtime) PER FILE, and the file count comes from the PR's diff — a number the author picks, not you. On a repo whose suite takes a minute, a ten-file PR is a job measured in tens of hours, discovered only once it is running. Leave empty to keep corral's own default bound."
    required: false
    default: ""
  timeout:
    description: "Per-file budget as a Go duration (e.g. '45m', '5h'). corral gives up on a single file's run once this has elapsed, and the default (10m) is sized for a PR author who did not choose to start an hours-long job — NOT for a whole audit. Every mutant re-runs your suite, so a converging audit of one large file on a hosted runner is measured in hours; raise this, and the job's own timeout-minutes with it, when you want the complete audit rather than a bounded sample. Leave empty to keep corral's own default."
    required: false
    default: ""
  anthropic-key:
    description: "Anthropic API key, supplied to the run as ANTHROPIC_API_KEY. Set as many provider keys as your role→model routing needs — they are independent and additive, NOT alternatives. corral rejects a run whose test-critic shares a model with its test-writer (a critic grading its own model's homework is not an independent check), so a genuinely cross-vendor pair needs two keys present in the same run. Pass as a secret; never inline."
    required: false
    default: ""
  gemini-key:
    description: "Google Gemini API key, supplied to the run as GEMINI_API_KEY. Additive with the other provider keys — see 'anthropic-key'."
    required: false
    default: ""
  openai-key:
    description: "OpenAI (or OpenAI-compatible) API key, supplied to the run as OPENAI_API_KEY. Additive with the other provider keys — see 'anthropic-key'."
    required: false
    default: ""
  model-key:
    description: "Generic escape hatch for a credential the named provider inputs above do not cover (e.g. GOOGLE_API_KEY, or a gateway that reads its own variable). Use 'anthropic-key' / 'gemini-key' / 'openai-key' in preference — they are clearer and compose. Pair with 'model-key-env' to say which variable it becomes."
    required: false
    default: ""
  model-key-env:
    description: "Which environment variable 'model-key' becomes. Must be a plain environment variable name; anything else is refused rather than exported. REQUIRED when 'model-key' is set — it used to default to ANTHROPIC_API_KEY to match corral's own default models, and corral no longer has default models, so guessing a vendor here would put the wrong key in the wrong variable. Setting this to the same variable a named provider input already fills, with a DIFFERENT value, is refused — there is no correct answer, and a silent precedence rule is how the wrong key gets used with no sign of it."
    required: false
    default: ""
  derive-model:
    description: "Model that derives a goal per file. REQUIRED unless 'goals' is supplied — corral has no default models, and 'goals' skips derivation entirely (that path calls no model and needs no key)."
    required: false
    default: ""
  writer-model:
    description: "Model for the test-writer role — the half that authors a test to prove a survivor is a real gap. REQUIRED: corral has no default models. Any provider you supply a key for."
    required: false
    default: ""
  mutant-model:
    description: "Model for the mutant-generator role. REQUIRED: corral has no default models."
    required: false
    default: ""
  shadow-model:
    description: "Challenger model that attacks every region a SECOND time, recorded for comparison and NEVER gating the verdict. OFF unless named — it used to default to a Claude model that stayed on through an otherwise all-Gemini run and silently demanded an Anthropic key. Name a model on the same vendor as the rest of the run to turn it on."
    required: false
    default: ""
  critic-model:
    description: "Model for the test-critic role, which must DIFFER from the writer's. 'off' disables the critic entirely — it is advisory and never gates the verdict, so a single-vendor run with only one usable model can drop it. No default: name a model or 'off'."
    required: false
    default: ""
  corral-version:
    description: "Which corral to install, as a `go install .../cmd/corral@<ref>` version (a tag, branch, or commit). Defaults to the ref this action itself was resolved at, so the installed binary always matches the action."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install corral
      shell: bash
      env:
        CORRAL_VERSION: ${{ inputs.corral-version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        if ! command -v go >/dev/null 2>&1; then
          echo "::error::corral requires a Go toolchain on the runner (it is installed via 'go install', not vendored). Add the 'actions/setup-go' action before this step, or otherwise put a 'go' binary on PATH." >&2
          exit 1
        fi
        ref="$CORRAL_VERSION"
        if [ -z "$ref" ]; then
          ref="$ACTION_REF"
        fi
        if [ -z "$ref" ]; then
          # github.action_ref is empty for a local `uses: ./` reference
          # (e.g. this repo's own CI checking out this action). There is no
          # ref to match in that case, so fall back to main.
          ref="main"
          echo "::warning::github.action_ref was empty (a local 'uses: ./' reference); installing corral@main instead of matching a resolved ref."
        fi
        gobin="${RUNNER_TEMP:-/tmp}/corral-gobin"
        mkdir -p "$gobin"
        echo "Installing corral@${ref} into ${gobin}"
        GOBIN="$gobin" go install "github.com/pdbethke/corralai/cmd/corral@${ref}"
        echo "$gobin" >> "$GITHUB_PATH"
    - name: Run corral
      shell: bash
      env:
        ANTHROPIC_KEY_IN: ${{ inputs.anthropic-key }}
        GEMINI_KEY_IN: ${{ inputs.gemini-key }}
        OPENAI_KEY_IN: ${{ inputs.openai-key }}
        MODEL_KEY: ${{ inputs.model-key }}
        MODEL_KEY_ENV: ${{ inputs.model-key-env }}
        DERIVE_MODEL: ${{ inputs.derive-model }}
        WRITER_MODEL: ${{ inputs.writer-model }}
        MUTANT_MODEL: ${{ inputs.mutant-model }}
        CRITIC_MODEL: ${{ inputs.critic-model }}
        SHADOW_MODEL: ${{ inputs.shadow-model }}
        DIFF_BASE: ${{ inputs.diff-base }}
        GOALS: ${{ inputs.goals }}
        TESTS: ${{ inputs.tests }}
        MIN_KILL_RATE: ${{ inputs.min-kill-rate }}
        MAX_PROVEN_MISSED: ${{ inputs.max-proven-missed }}
        ATTEST: ${{ inputs.attest }}
        PUSH_TARGET: ${{ inputs.push }}
        motherduck_token: ${{ inputs.motherduck-token }}
        TOP: ${{ inputs.top }}
        TIMEOUT: ${{ inputs.timeout }}
        REPO_OWNER: ${{ github.repository_owner }}
        COMMIT_SHA: ${{ github.sha }}
        TEST_COMMAND: ${{ inputs.test-command }}
      run: |
        set -euo pipefail
        # Provider credentials are wired in under the names corral's own
        # resolution reads (internal/agentbackend): ANTHROPIC_API_KEY,
        # GEMINI_API_KEY (which itself falls back to GOOGLE_API_KEY then
        # OPENAI_API_KEY), OPENAI_API_KEY.
        #
        # SEVERAL AT ONCE, deliberately. CheckDecorrelation rejects a run whose
        # test-critic shares a model with its test-writer — a critic grading its
        # own model's homework is not an independent check — so a real audit
        # needs at least two models, and genuine independence usually means two
        # VENDORS. A one-key-at-a-time input cannot express that, and its only
        # escape is turning the critic off: disabling corral's independence
        # check because the plumbing could not carry a second credential.
        #
        # No key value is ever echoed: a job log is readable by anyone who can
        # see the run.
        declared_names=()
        declared_values=()
        declare_key() { # name, value — records an intended export, empty ignored
          [ -n "$2" ] || return 0
          local i=0
          while [ "$i" -lt "${#declared_names[@]}" ]; do
            if [ "${declared_names[$i]}" = "$1" ]; then
              # Two inputs naming the same variable with DIFFERENT values have
              # no correct answer. A silent precedence rule is how the wrong
              # key gets used with no sign of it, so refuse. Agreeing values
              # are merely redundant and pass.
              if [ "${declared_values[$i]}" != "$2" ]; then
                echo "::error::two inputs set $1 to different values (a named provider key and model-key/model-key-env). Remove one — the action will not silently choose between two credentials for the same provider." >&2
                exit 1
              fi
              return 0
            fi
            i=$((i + 1))
          done
          declared_names+=("$1")
          declared_values+=("$2")
        }

        declare_key ANTHROPIC_API_KEY "${ANTHROPIC_KEY_IN:-}"
        declare_key GEMINI_API_KEY "${GEMINI_KEY_IN:-}"
        declare_key OPENAI_API_KEY "${OPENAI_KEY_IN:-}"

        # The generic escape hatch, for a credential the named inputs do not
        # cover. Its name is itself an input, so it is validated before use: an
        # env assignment is `NAME=VALUE`, so a "name" containing an `=` would
        # smuggle a second assignment into the export, and a name with a shell
        # metacharacter has no legitimate use here at all.
        if [ -n "${MODEL_KEY:-}" ]; then
          # No fallback variable. This used to default to ANTHROPIC_API_KEY to
          # match corral's own default models; corral has no default models
          # now, so guessing a vendor here would silently put the operator's
          # key into the wrong variable and fail later as "missing key".
          key_env="$MODEL_KEY_ENV"
          if [ -z "$key_env" ]; then
            echo "::error::model-key is set but model-key-env is empty — say which environment variable the key becomes (e.g. GEMINI_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, OPENROUTER_API_KEY). Prefer the named 'gemini-key'/'openai-key'/'anthropic-key' inputs, which need no second field." >&2
            exit 1
          fi
          if ! printf '%s' "$key_env" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*$'; then
            echo "::error::model-key-env must be a plain environment variable name (letters, digits and underscore, not starting with a digit) — got something else, which will not be exported. Use one of corral's credential names: GEMINI_API_KEY, GOOGLE_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY." >&2
            exit 1
          fi
          declare_key "$key_env" "$MODEL_KEY"
        fi

        # Only non-empty keys are exported. Exporting an empty value would
        # BLANK a credential the runner legitimately carried, and the audit
        # would then fail on a missing key that was in fact present.
        i=0
        while [ "$i" -lt "${#declared_names[@]}" ]; do
          export "${declared_names[$i]}=${declared_values[$i]}"
          i=$((i + 1))
        done

        base="$DIFF_BASE"
        if [ -z "$base" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          base="origin/$GITHUB_BASE_REF"
        fi
        # The record this run publishes must name what it audited: --owner and
        # --commit are what the report header ("Repo adequacy — owner/repo @
        # commit") is built from, and GitHub already knows both. --repo takes
        # the workspace path rather than "."; the repo NAME in the header is
        # that path's basename, and "." names nothing.
        args=(certify --repo "${GITHUB_WORKSPACE:-.}" --substrate workspace)
        args+=(--owner "$REPO_OWNER" --commit "$COMMIT_SHA")
        [ -n "$base" ] && args+=(--diff-base "$base")
        [ -n "$GOALS" ] && args+=(--goals "$GOALS")
        [ -n "${TESTS:-}" ] && args+=(--tests "$TESTS")
        [ -n "$MIN_KILL_RATE" ] && args+=(--min-kill-rate "$MIN_KILL_RATE")
        [ -n "${MAX_PROVEN_MISSED:-}" ] && args+=(--max-proven-missed "${MAX_PROVEN_MISSED:-}")
        [ -n "${PUSH_TARGET:-}" ] && args+=(--push "${PUSH_TARGET:-}")
        # The statement is written BEFORE the gate's exit code is honoured
        # below, so a FAILING audit still produces a receipt. A verdict you only
        # get to keep when it is flattering is not evidence.
        if [ "${ATTEST:-}" = "true" ]; then
          args+=(--attest "${RUNNER_TEMP:-/tmp}/corral-audit-statement.json")
          echo "CORRAL_ATTEST_PATH=${RUNNER_TEMP:-/tmp}/corral-audit-statement.json" >> "$GITHUB_ENV"
        fi
        [ -n "${TOP:-}" ] && args+=(--top "$TOP")
        [ -n "${TIMEOUT:-}" ] && args+=(--timeout "$TIMEOUT")
        # Role→model routing. Each is omitted when empty so corral keeps
        # ownership of its own defaults — the action must never become a second
        # place where a default model is decided.
        [ -n "${DERIVE_MODEL:-}" ] && args+=(--derive-model "$DERIVE_MODEL")
        [ -n "${WRITER_MODEL:-}" ] && args+=(--writer-model "$WRITER_MODEL")
        [ -n "${MUTANT_MODEL:-}" ] && args+=(--mutant-model "$MUTANT_MODEL")
        [ -n "${CRITIC_MODEL:-}" ] && args+=(--critic-model "$CRITIC_MODEL")
        [ -n "${SHADOW_MODEL:-}" ] && args+=(--shadow-model "$SHADOW_MODEL")
        # $TEST_COMMAND is data, not script: it is split into argv words the
        # way a real shell's own parser would (so "go test ./..." becomes
        # three args, and pytest -k "not slow" keeps "not slow" as one),
        # but it is never handed to bash for evaluation, so shell
        # metacharacters (;, backticks, $( )) in it cannot execute.
        #
        # A YAML block scalar (test-command: |) can carry an embedded
        # newline; silently keeping only the first line would grade a
        # different, truncated command than the one written, so reject it
        # instead.
        if [[ "$TEST_COMMAND" == *$'\n'* ]]; then
          echo "::error::test-command must be a single line — a multi-line value (e.g. from a YAML block scalar) would be silently truncated to its first line rather than run in full." >&2
          exit 1
        fi
        # GitHub does not actually enforce `required: true`, and an empty
        # value can also arrive through a reusable workflow. Reject it here
        # rather than letting it become a one-element argv holding "" below
        # (GNU xargs still runs its command once on empty input without
        # -r): corral would treat that as an explicit, empty test command
        # and try to exec it — every candidate fails its baseline for an
        # opaque reason, the same undiagnosable shape the newline check
        # above exists to prevent, arriving through a different door.
        if [[ -z "${TEST_COMMAND//[[:space:]]/}" ]]; then
          echo "::error::test-command is empty (or whitespace-only). It is required — corral will not silently fall back to a guessed test command." >&2
          exit 1
        fi
        # xargs does its own shell-style quote parsing (single and double
        # quotes are honoured) WITHOUT being a shell: it never evaluates
        # $( ), backticks, ;, &&, redirection, or globs, and -d is
        # deliberately not passed on the INPUT side since that disables the
        # quote handling this depends on. An unmatched quote makes xargs
        # fail, which must surface as an error, not an empty or partial
        # argv — checked here as its own pass (before the parse below)
        # since the parse's own pipeline exit status is not reliably
        # observable once it feeds a NUL-delimited `mapfile` via process
        # substitution.
        if ! printf '%s\n' "$TEST_COMMAND" | xargs -r -n1 printf '%s\0' >/dev/null; then
          echo "::error::test-command could not be parsed as shell-style words (check for an unmatched quote): $TEST_COMMAND" >&2
          exit 1
        fi
        # The actual split: NUL-delimited output, read with `mapfile -d ''`,
        # so a trailing empty argument (`pytest ""`, or `pytest -k ""`)
        # survives — `$( )` command substitution strips trailing newlines,
        # which would otherwise silently drop exactly that argument. The
        # trailing `\n` fed to xargs above is required too: without it, GNU
        # xargs drops a trailing empty-quoted argument outright rather than
        # emitting it as a zero-length one.
        mapfile -d '' TEST_ARGV < <(printf '%s\n' "$TEST_COMMAND" | xargs -r -n1 printf '%s\0')
        # The load-bearing guard is HERE, over the parsed OUTPUT, not the
        # input string above — and it checks the actual invariant corral
        # needs, not a shape of the input. What makes an argv usable as a
        # command is simply: there is at least one word, and the FIRST one
        # (the program name corral will exec) is not empty. That is the
        # whole property; an empty argument ANYWHERE ELSE is completely
        # legitimate (`pytest ""`, `pytest -k ""`) and must not trip this.
        # A check phrased as a shape of the input ("is it whitespace?", "is
        # the argv exactly one empty element?") only ever catches the
        # shapes already seen; checking argv[0] directly catches every
        # shape that can produce an unusable command, including ones not
        # yet constructed.
        if [ "${#TEST_ARGV[@]}" -eq 0 ] || [ -z "${TEST_ARGV[0]}" ]; then
          echo "::error::test-command has no command to run (the program name is empty or missing). It is required — corral will not silently fall back to a guessed test command." >&2
          exit 1
        fi
        # corral's report IS the product — the kill rate, the survivors, and
        # the honesty lines (NOT AUDITED / DID NOT FINISH / WRITER FAILED /
        # TEST UNSOUND) that say what a number does and does not mean. On a
        # runner, stdout is a collapsed job log nobody opens, so a run that
        # proved a real gap and a run that found nothing look identical from
        # the PR page. Mirror the report into the job summary, where it is the
        # first thing visible on the run.
        #
        # $GITHUB_STEP_SUMMARY rather than a PR comment, deliberately: it needs
        # no `permissions:` block, it works on fork PRs (where a comment token
        # does not exist), and re-runs replace it instead of stacking up.
        #
        # The report is reproduced VERBATIM. Re-rendering it here would be a
        # second renderer, free to drift from printRepoReport — and drift in a
        # summary always flatters the run, because the lines that get lost are
        # the qualifying ones.
        report="${RUNNER_TEMP:-/tmp}/corral-report.txt"
        status=0
        # `set -o pipefail` is on (top of this script), so the pipeline's
        # status is corral's, not tee's. Without it the status would be tee's,
        # which is 0 essentially always: a --min-kill-rate failure — the entire
        # merge gate — would exit 0 and the PR would go green on exactly the
        # change the gate was installed to block. `|| status=$?` is what keeps
        # `set -e` from taking the script down before the summary is written;
        # the status is re-raised at the end, unchanged.
        corral "${args[@]}" -- "${TEST_ARGV[@]}" | tee "$report" || status=$?

        # Reporting is a side channel: it must never be the reason an audit
        # fails. $GITHUB_STEP_SUMMARY is set by the Actions runner and by
        # nothing else, so it is legitimately absent under `act`, on some
        # self-hosted setups, and when this script is run directly.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$report" ]; then
          # GitHub rejects a summary over 1MiB OUTRIGHT — an unbounded write
          # loses the whole report, not just its tail. Bound it, keeping the
          # HEAD (the verdict line is the first thing printed), and say so
          # where it was cut: a silently truncated report reads exactly like a
          # short one, and this action already refuses to silently truncate a
          # multi-line test-command for the same reason.
          limit=900000
          size=$(wc -c < "$report")
          # A fixed ``` fence is closed early by any line in the report that
          # itself begins with three backticks, after which the remainder
          # renders as markdown and the preformatted layout (the indentation
          # of the weakest-files list is load-bearing) is lost. Grow the fence
          # past the longest backtick run the report actually contains.
          longest=$( { grep -o '`\+' "$report" || true; } | awk '{ if (length($0) > n) n = length($0) } END { print n+0 }' )
          fence='```'
          while [ "${#fence}" -le "$longest" ]; do
            fence="${fence}\`"
          done
          {
            echo "## Corral — adversarial test audit"
            echo
            echo "$fence"
            head -c "$limit" "$report"
            # head -c can stop mid-line; without this the closing fence would
            # be appended to that partial line and never open its own.
            echo
            echo "$fence"
            if [ "$size" -gt "$limit" ]; then
              echo
              echo "_Report truncated at ${limit} of ${size} bytes to stay under GitHub's 1MiB step-summary limit. The full report is in this step's log._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit "$status"

    # Publish the verdict as a GitHub artifact attestation.
    #
    # always(): the run step above exits with the gate's status, so without it
    # a FAILING audit would produce no receipt — and a verdict you only keep
    # when it flatters you is not evidence. The failing runs are the ones a
    # reviewer most needs to be able to check.
    #
    # Signing is keyless, through the workflow's own OIDC identity. A
    # `certify --local` run signs with a key generated on the machine, which on
    # an ephemeral runner means a fresh key per run that chains to nothing; an
    # attestation chains to the repository and the workflow, which is what a
    # reviewer actually wants to verify.
    - name: Extract the predicate for attestation
      id: corral-predicate
      if: always() && env.CORRAL_ATTEST_PATH != ''
      shell: bash
      run: |
        set -euo pipefail
        stmt="$CORRAL_ATTEST_PATH"
        if [ ! -s "$stmt" ]; then
          echo "::notice::corral wrote no audit statement (nothing was audited), so nothing is attested."
          echo "present=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # actions/attest builds its OWN in-toto envelope from subject + predicate,
        # so hand it the predicate alone. The full statement is uploaded intact
        # as an artifact beside it, so the standalone document survives too.
        jq -e '.predicate' "$stmt" > "${RUNNER_TEMP}/corral-predicate.json"
        echo "present=true" >> "$GITHUB_OUTPUT"

    - name: Attest the audit verdict
      if: always() && steps.corral-predicate.outputs.present == 'true'
      uses: actions/attest@v4.2.2
      with:
        subject-path: ${{ env.CORRAL_ATTEST_PATH }}
        predicate-type: https://corralai.dev/certify/audit/v1
        predicate-path: ${{ runner.temp }}/corral-predicate.json

    - name: Upload the audit statement
      if: always() && steps.corral-predicate.outputs.present == 'true'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: corral-audit-statement
        path: ${{ env.CORRAL_ATTEST_PATH }}
        if-no-files-found: error

    - name: How to verify this verdict
      if: always() && steps.corral-predicate.outputs.present == 'true'
      shell: bash
      run: |
        {
          echo
          echo "### Verify this verdict yourself"
          echo
          echo "The audit statement is attached to this run as \`corral-audit-statement\`, and signed"
          echo "by this workflow's own identity — not by a key that lived on the runner. Download it and:"
          echo
          echo '```'
          echo "gh attestation verify corral-audit-statement.json --repo ${GITHUB_REPOSITORY}"
          echo '```'
          echo
          echo "That answers which repository, which workflow and which commit produced this audit,"
          echo "without trusting the log above or the person who linked you to it."
          echo
          echo "\`gh attestation\` needs a reasonably recent GitHub CLI — it does not exist in 2.45,"
          echo "which is still what some distributions ship, and an older CLI answers with a help"
          echo "dump rather than an error. Same answer straight from the API, no CLI version to care about:"
          echo
          echo '```'
          echo "DIGEST=\$(sha256sum corral-audit-statement.json | cut -d\" \" -f1)"
          echo "gh api repos/${GITHUB_REPOSITORY}/attestations/sha256:\$DIGEST"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
