<!doctype html>
<meta charset="utf-8">
<title>corral</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#fbfbfa;--fg:#16181d;--dim:#666e79;--rule:#e2e5ea;--surface:#fff;--bad:#9c2b21;--warn:#8a5a00;--ok:#1f6142}
  @media(prefers-color-scheme:dark){:root{--bg:#101216;--fg:#e6e9ed;--dim:#8b939e;--rule:#282d35;--surface:#171a1f;--bad:#e5877d;--warn:#d6a65c;--ok:#6fc49a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,sans-serif}
  header{padding:2rem 1.5rem 1rem;border-bottom:1px solid var(--rule)}
  h1{margin:0;font-size:1.4rem;font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:.9rem;margin-top:.3rem}
  main{padding:1.25rem 1.5rem 4rem}
  .tot{display:flex;gap:2rem;flex-wrap:wrap;margin-bottom:1.25rem}
  .tot div{min-width:7rem}
  .n{font-size:1.8rem;font-weight:600;font-variant-numeric:tabular-nums}
  .l{color:var(--dim);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);padding:.5rem .6rem;border-bottom:1px solid var(--rule)}
  td{padding:.5rem .6rem;border-bottom:1px solid var(--rule);vertical-align:top}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  code{font:.86em ui-monospace,monospace}
  .gap{color:var(--bad);font-weight:600}
  .rate-lo{color:var(--bad)}.rate-mid{color:var(--warn)}.rate-hi{color:var(--ok)}
  .empty,.err{padding:2rem 0;color:var(--dim)}
  .err{color:var(--bad)}
  h2{font-size:1.1rem;font-weight:600;margin:2.5rem 0 .25rem;letter-spacing:-.01em}
  .chip{display:inline-block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:.1rem .45rem;border-radius:3px;border:1px solid var(--rule);color:var(--dim);vertical-align:middle}
  .chip.ok{color:var(--ok);border-color:var(--ok)}.chip.bad{color:var(--bad);border-color:var(--bad)}.chip.warn{color:var(--warn);border-color:var(--warn)}
  .review{border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:1rem 1.25rem;margin:1rem 0}
  .review .meta{color:var(--dim);font-size:.85rem;margin-bottom:.6rem}
  .review p{margin:.5rem 0;max-width:72ch}
  .finding{border-top:1px solid var(--rule);padding:.8rem 0}
  .finding .claim{font-weight:600}
  .finding .where{color:var(--dim);font-size:.85rem}
  .finding pre{font:.8em ui-monospace,monospace;background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:.6rem .8rem;overflow-x:auto;margin:.4rem 0;white-space:pre-wrap}
  .seat{margin:.5rem 0 .2rem;font-size:.9rem}
  .seat b{font-weight:600}
  .verdict{margin:.4rem 0;padding:.4rem .7rem;border-left:3px solid var(--rule);font-size:.9rem}
  .verdict.confirmed{border-color:var(--ok)}.verdict.refuted{border-color:var(--bad)}
  .sound{color:var(--dim);font-size:.88rem;margin:.6rem 0 0;padding-left:1.1rem}
  details summary{cursor:pointer;color:var(--dim);font-size:.85rem}
  .queue .item{border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:.9rem 1.1rem;margin:.75rem 0}
  .queue textarea{width:100%;min-height:4.5rem;font:inherit;padding:.4rem;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--fg)}
  .queue button{font:inherit;padding:.3rem .8rem;border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--fg);cursor:pointer;margin-right:.4rem}
  .queue button.confirm{border-color:var(--ok);color:var(--ok)}.queue button.refute{border-color:var(--bad);color:var(--bad)}
  .queue pre{white-space:pre-wrap;font:.8rem ui-monospace,monospace;background:var(--bg);border:1px solid var(--rule);padding:.5rem;border-radius:4px;max-height:14rem;overflow:auto}
  .writebar{padding:.6rem 1.5rem;border-bottom:1px solid var(--rule);font-size:.88rem}
</style>
<header>
  <h1>corral</h1>
  <div class="sub">The record, read from the ledger directory: the newest verdict per file, the chain itself, and the reviews with what each seat argued and what a person decided.</div>
</header>
<div id="writebar" class="writebar" hidden></div>
<main>
  <h2>The seal</h2>
  <div class="sub" style="margin-bottom:1rem">The newest verdict per file. Proven gaps first &mdash; a survivor a test provably catches.</div>
  <div class="tot" id="tot"></div>
  <div id="body"><div class="empty">Loading&hellip;</div></div>
  <div id="lastwrite" class="sub" hidden></div>
  <section id="verdicts" class="queue" hidden></section>
  <div id="ledger"></div>
</main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rateClass = r => r >= .8 ? 'rate-hi' : r >= .5 ? 'rate-mid' : 'rate-lo';
const shortRepo = r => String(r).replace(/^https:\/\/github\.com\//, '');

// THE LAUNCH TOKEN. It arrives in the URL fragment (never sent to the
// server), is kept for this tab only, and leaves the address bar at once.
const TOKEN = (() => {
  const m = /[#&]t=([0-9a-f]{64})/.exec(location.hash);
  if (m) {
    sessionStorage.setItem('corral-ui-token', m[1]);
    history.replaceState(null, '', location.pathname + location.search);
  }
  return sessionStorage.getItem('corral-ui-token') || '';
})();

const write = (path, body) => fetch(path, {
  method: 'POST',
  headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN},
  body: JSON.stringify(body),
}).then(async res => {
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
});

const loadLedger = () => fetch('api/ledger').then(async res => {
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
});

fetch('api/seal').then(async res => {
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}).then(rows => {
  const body = document.getElementById('body');
  if (!rows || !rows.length) {
    // "No rows" is not "no gaps" — say which one this is.
    body.innerHTML = '<div class="empty">This ledger has no scans yet. Run <code>corral certify --repo &lt;dir&gt;</code> and reload.</div>';
    return;
  }
  const gaps = rows.reduce((a, r) => a + (r.proven_missed || 0), 0);
  const surv = rows.reduce((a, r) => a + (r.survivors || 0), 0);
  const repos = new Set(rows.map(r => r.repo)).size;
  document.getElementById('tot').innerHTML = [
    ['proven gaps', gaps], ['survivors', surv], ['files', rows.length], ['repos', repos],
  ].map(([l, n]) => `<div><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  body.innerHTML = `<table><thead><tr>
      <th>repo</th><th>file</th><th class="num">kill rate</th>
      <th class="num">survivors</th><th class="num">proven gaps</th><th>audited</th>
    </tr></thead><tbody>` + rows.map(r => `<tr>
      <td>${esc(shortRepo(r.repo))}</td>
      <td><code>${esc(r.path)}</code></td>
      <td class="num ${rateClass(r.kill_rate)}">${(r.kill_rate ?? 0).toFixed(2)}</td>
      <td class="num">${r.survivors ?? 0}</td>
      <td class="num ${r.proven_missed ? 'gap' : ''}">${r.proven_missed ?? 0}</td>
      <td>${esc(String(r.ts).slice(0, 10))}</td>
    </tr>`).join('') + '</tbody></table>';
}).catch(e => {
  // A failed read must never render as an empty, reassuring table.
  document.getElementById('body').innerHTML =
    '<div class="err">Could not read the ledger: ' + esc(e.message) + '</div>';
});

// The ledger half. Everything the seal cannot show.
const when = t => esc(String(t).replace('T', ' ').slice(0, 16));
const chip = (cls, text) => `<span class="chip ${cls}">${esc(text)}</span>`;
const tierChip = f => {
  const demoted = f.tier !== f.declared;
  const cls = f.tier === 'REPRODUCED' ? 'bad' : demoted ? 'warn' : '';
  return chip(cls, f.tier) + (demoted ? ' <span class="where">declared ' + esc(f.declared) + '</span>' : '');
};
const scriptBlock = (label, script, exit, out) => {
  if (!script) return '';
  let h = `<details><summary>${esc(label)}${exit != null ? ' — exit ' + exit : ''}</summary><pre>${esc(script)}</pre>`;
  if (out) h += `<pre>${esc(out)}</pre>`;
  return h + '</details>';
};
const findingHTML = f => {
  let h = `<div class="finding"><div><b>${esc(f.id)}</b> ${tierChip(f)} ${f.severity ? chip('', f.severity) : ''}
    <span class="where">${esc(f.file || '')}${f.line ? ':' + f.line : ''}</span></div>
    <div class="claim">${esc(f.claim)}</div>`;
  h += scriptBlock('the reviewer\'s script', f.script, f.exit_code, f.stdout);
  if (f.demoted) h += `<div class="seat">demoted: ${esc(f.demoted)}</div>`;
  const x = f.refutation;
  if (x) {
    h += `<div class="seat"><b>verifier ${esc(x.model)}</b> — ${x.verdict === 'REFUTED' ? chip(x.tier === 'REPRODUCED' ? 'bad' : 'warn', 'refuted · ' + x.tier) : chip('', 'stands')}: ${esc(x.argument)}</div>`;
    h += scriptBlock('the verifier\'s script', x.script, x.exit_code, x.stdout);
    if (x.demoted) h += `<div class="seat">refutation demoted: ${esc(x.demoted)}</div>`;
  }
  const a = f.adjudication;
  if (a) h += `<div class="verdict ${esc(a.verdict)}"><b>${esc(a.verdict)}</b> by ${esc(a.by)} — ${esc(a.reason)}</div>`;
  return h + '</div>';
};

fetch('api/ledger').then(async res => {
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}).then(l => {
  const el = document.getElementById('ledger');
  if (!l.dir) {
    el.innerHTML = '<h2>The chain</h2><div class="empty">Not a ledger directory: <code>--db</code> named a warehouse, so there is no chain, no reviews and no adjudications here. Point <code>corral ui --db</code> at <code>.corral/ledger</code> to see them.</div>';
    return;
  }
  const n = (l.entries || []).length;
  let h = `<h2>The chain</h2><div class="sub" style="margin-bottom:1rem">${n} entr${n === 1 ? 'y' : 'ies'} in <code>${esc(l.dir)}</code> &mdash; `
    + (l.problems ? chip('bad', l.problems + ' problem' + (l.problems > 1 ? 's' : '')) + ' the chain is not intact' : chip('ok', 'intact'))
    + (l.verified_against ? ', signatures checked against ' + esc(l.verified_against) : ', signatures not checked (no certify key here)') + '</div>';
  if (n) {
    h += '<table><thead><tr><th>#</th><th>when</th><th>kind</th><th>what</th><th>signature</th></tr></thead><tbody>' + l.entries.map(e => {
      const sig = e.problem ? chip('bad', 'problem') : !e.signed ? chip('warn', 'unsigned') : e.verified ? chip('ok', 'verified · ' + e.keyid) : chip('', 'signed · ' + e.keyid);
      let what = '';
      if (e.kind === 'scan') what = `<code>${esc(String(e.commit).slice(0, 12))}</code> ${esc(shortRepo(e.repo || ''))} — ${e.audited} audited, ${e.files} file rows, ${e.mutants} mutants` + (e.note ? ' <span class="gap">' + esc(e.note) + '</span>' : '');
      else what = esc(e.note || e.problem || '');
      return `<tr><td class="num">${e.pos}</td><td>${when(e.when)}</td><td>${esc(e.kind)}</td><td>${what}${e.problem && e.kind === 'scan' ? '<div class="err">' + esc(e.problem) + '</div>' : ''}</td><td>${sig}</td></tr>`;
    }).join('') + '</tbody></table>';
  }
  const rs = l.reviews || [];
  h += `<h2>Reviews</h2>`;
  if (!rs.length) h += '<div class="empty">No reviews in this ledger. <code>corral review --scope &lt;dir&gt; --reviewer-model &lt;m&gt;</code> writes one.</div>';
  h += rs.map(r => `<div class="review">
    <div class="meta">#${r.pos} · ${when(r.when)} · <code>${esc(String(r.commit).slice(0, 12))}</code> · scope <code>${esc(r.scope)}</code> · reviewer <b>${esc(r.reviewer)}</b>${r.verifier ? ' · verifier <b>' + esc(r.verifier) + '</b>' : ''}
      · ${r.reproduced} reproduced, ${r.code_read} code-read, ${r.hypothesis} hypothesis · ${r.files_shown} file${r.files_shown === 1 ? '' : 's'} shown${r.truncated ? ' (some not)' : ''}${r.statement_sha256 ? ' · attested' : ''}</div>
    <p>${esc(r.opinion)}</p>
    ${r.verifier_opinion ? '<p><b>' + esc(r.verifier) + ':</b> ' + esc(r.verifier_opinion) + '</p>' : ''}
    ${(r.findings || []).map(findingHTML).join('')}
    ${r.sound && r.sound.length ? '<ul class="sound">' + r.sound.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<div class="sound">The reviewer listed nothing as checked and sound — its coverage is unknown.</div>'}
  </div>`).join('');
  el.innerHTML = h;
}).catch(e => {
  document.getElementById('ledger').innerHTML = '<h2>The chain</h2><div class="err">Could not read the ledger: ' + esc(e.message) + '</div>';
});

// THE VERDICT QUEUE — write mode only. Every action runs a corral command on
// the server; this page shows what it said and changes nothing itself.
const renderVerdicts = l => {
  const sec = document.getElementById('verdicts');
  if (!l.write || !TOKEN) { sec.hidden = true; return; }
  const pending = [], open = [];
  for (const r of (l.reviews || [])) for (const f of (r.findings || [])) {
    const item = {r, f, ref: String(r.hash).slice(0, 12) + '#' + f.id};
    if (!f.adjudication) pending.push(item);
    else if (f.adjudication.verdict === 'confirmed') open.push(item);
  }
  const card = ({r, f, ref}) => `<div class="item" data-ref="${esc(ref)}" data-hash="${esc(String(r.hash).slice(0, 12))}"
      data-verifier="${f.refutation ? esc(r.verifier + ' ' + f.refutation.verdict) : ''}">
    <div class="meta"><code>${esc(ref)}</code> · ${esc(f.tier)} · ${esc(f.severity || '')} · <code>${esc(f.file || '')}${f.line ? ':' + f.line : ''}</code>
      · reviewer <b>${esc(r.reviewer)}</b>${r.verifier ? ' · verifier <b>' + esc(r.verifier) + '</b>' : ''}</div>
    <p>${esc(f.claim)}</p>
    ${f.refutation ? '<div class="sub"><b>verifier:</b> ' + esc(f.refutation.verdict) + ' — ' + esc(f.refutation.argument || '') + '</div>' : ''}
    ${f.script ? '<details><summary>script (exit ' + esc(String(f.exit_code ?? '—')) + ' at review time)</summary><pre>' + esc(f.script) + '</pre><pre>' + esc(f.stdout || '') + '</pre></details>'
               : '<div class="sub">no script: judge from the code at <code>' + esc(f.file || '?') + ':' + esc(String(f.line || '?')) + '</code> (commit <code>' + esc(String(r.commit).slice(0, 12)) + '</code>)</div>'}
    <div class="recheck sub"></div><div class="cites sub"></div>
    ${f.script ? '<button class="do-recheck">Re-run on HEAD</button>' : ''}
    <textarea placeholder="your reason (required)"></textarea>
    <div><button class="confirm">Confirm</button><button class="refute">Refute</button><span class="result sub"></span></div>
  </div>`;
  sec.innerHTML = `<h2>Needs your verdict</h2><div class="sub">${pending.length} finding${pending.length === 1 ? '' : 's'} with no human verdict. Every button runs a <code>corral review</code> command on this machine.</div>`
    + (pending.length ? pending.map(card).join('') : '<div class="empty">Nothing is waiting for a verdict.</div>')
    + `<h2>Confirmed — open unless a recheck says otherwise</h2>`
    + (open.length ? open.map(({r, f, ref}) => `<div class="item" data-ref="${esc(ref)}" data-hash="${esc(String(r.hash).slice(0, 12))}">
        <code>${esc(ref)}</code> — ${esc(f.claim)}<div class="recheck sub"></div><div class="cites sub"></div>
        ${f.script ? '<button class="do-recheck">Re-run on HEAD</button>' : '<span class="sub">no script: judge from the code</span>'}</div>`).join('')
      : '<div class="empty">None.</div>');
  sec.hidden = false;
  for (const el of sec.querySelectorAll('.item[data-ref]')) wireItem(el);
};

const suggest = el => {
  const parts = [];
  if (el.dataset.verifier) parts.push('verifier ' + el.dataset.verifier);
  const rc = el.dataset.recheck;
  if (rc) parts.push(rc);
  const cites = el.dataset.cites;
  if (cites) parts.push(cites + ' (cited by a commit message, not verified)');
  const ta = el.querySelector('textarea');
  if (!ta.value.trim() && parts.length) ta.value = parts.join('; ');
};

const wireItem = el => {
  const ref = el.dataset.ref;
  fetch('api/cited?hash=' + encodeURIComponent(el.dataset.hash)).then(async r => {
    const cs = await r.json().catch(() => null);
    if (!r.ok) {
      el.querySelector('.cites').innerHTML = 'could not check citations: ' + esc((cs && cs.error) || r.statusText);
      return;
    }
    if (!Array.isArray(cs) || !cs.length) return;
    const txt = cs.map(c => c.commit + ' "' + c.subject + '"').join(', ');
    el.querySelector('.cites').innerHTML = 'named in: ' + esc(txt) + ' — <i>cited by a commit message, not verified</i>';
    el.dataset.cites = 'named in ' + txt;
  }).catch(e => { el.querySelector('.cites').innerHTML = 'could not check citations: ' + esc(e.message); });
  const rb = el.querySelector('.do-recheck');
  if (rb) rb.onclick = () => {
    rb.disabled = true;
    el.querySelector('.recheck').textContent = 'running the script against HEAD…';
    write('api/recheck', {ref}).then(res => {
      const code = res.exit_code === undefined ? '' : ' (exit ' + res.exit_code + ')';
      el.querySelector('.recheck').innerHTML = '<b>' + esc(res.outcome) + '</b> at <code>' + esc(String(res.commit).slice(0, 12)) + '</code>' + esc(code)
        + (res.reason ? ' — ' + esc(res.reason) : '') + (res.output ? '<pre>' + esc(res.output) + '</pre>' : '');
      el.dataset.recheck = 'recheck at ' + String(res.commit).slice(0, 12) + ': ' + res.outcome + code;
      if (el.querySelector('textarea')) suggest(el);
    }).catch(e => { el.querySelector('.recheck').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; })
      .finally(() => { rb.disabled = false; });
  };
  for (const [cls, verdict] of [['confirm', 'confirm'], ['refute', 'refute']]) {
    const btn = el.querySelector('button.' + cls);
    if (!btn) continue; // the still-open list offers a recheck, not a second verdict
    btn.onclick = () => {
      const reason = el.querySelector('textarea').value.trim();
      const out = el.querySelector('.result');
      if (!reason) { out.innerHTML = '<span class="err">a reason is required</span>'; return; }
      out.textContent = 'running corral review adjudicate…';
      const confirmBtn = el.querySelector('button.confirm'), refuteBtn = el.querySelector('button.refute');
      if (confirmBtn) confirmBtn.disabled = true;
      if (refuteBtn) refuteBtn.disabled = true;
      write('api/adjudicate', {ref, verdict, reason})
        .then(res => {
          const lw = document.getElementById('lastwrite');
          lw.textContent = ref + ': ' + res.output;
          lw.hidden = false;
          return loadLedger().then(renderVerdicts);
        })
        .catch(e => {
          out.innerHTML = '<span class="err">' + esc(e.message) + '</span>';
          if (confirmBtn) confirmBtn.disabled = false;
          if (refuteBtn) refuteBtn.disabled = false;
        });
    };
  }
};

if (TOKEN) {
  write('api/whoami', {}).then(me => {
    const bar = document.getElementById('writebar');
    bar.innerHTML = 'WRITE mode — verdicts are recorded as <b>' + esc(me.by) + '</b>; rechecks run against <code>' + esc(me.repo) + '</code>.';
    bar.hidden = false;
    return loadLedger().then(renderVerdicts);
  }).catch(e => {
    const bar = document.getElementById('writebar');
    bar.innerHTML = '<span class="err">Write mode unavailable: ' + esc(e.message) + '. Open the URL <code>corral ui --write</code> printed.</span>';
    bar.hidden = false;
  });
}
</script>
