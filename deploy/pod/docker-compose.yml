# SPDX-License-Identifier: Elastic-2.0
#
# corralai POD — a server-side frontier-worker pool.
#
# Unlike deploy/demo (a self-contained brain + local-model agents on one host),
# the pod runs ONLY workers and points them at an ALREADY-RUNNING production
# brain (e.g. corral.service on the same box, auth-on, bound to 127.0.0.1:9019).
# No brain, no Ollama here — frontier vendor CLIs need only CPU + network + creds.
#
#   host box
#   ┌────────────────────────────────────────────────────────────┐
#   │  corral.service  (systemd, 127.0.0.1:9019, auth-ON)         │
#   │        ▲ Bearer <worker-token>                              │
#   │  ┌─────┴──────────────  docker: corralai-pod  ───────────┐  │
#   │  │  auth-proxy (nginx) ── injects Authorization header    │  │
#   │  │        ▲ tokenless http                                 │  │
#   │  │  builder=claude  tester=gemini  pentester=codex  ...    │  │
#   │  └────────────────────────────────────────────────────────┘  │
#   └────────────────────────────────────────────────────────────┘
#
# The proxy holds the single worker token so the four vendor CLIs stay
# auth-agnostic (each has its own incompatible MCP-config mechanism; teaching
# all four to carry a bearer is the thing we are deliberately avoiding).
#
# STATUS: v1 draft. The auth ceremony (per-vendor creds) and the worker-token
# mint are documented in README.md and are the parts to finalize on the box
# with real credentials. Nothing here is validated against the prod brain yet.

name: corralai-pod

x-worker: &worker
  build:
    context: ../..
    dockerfile: deploy/pod/Dockerfile.worker
  restart: unless-stopped
  init: true                       # reap bwrap / CLI children
  cap_add: ["SYS_ADMIN"]           # inner bwrap jail (demo-grade; see Dockerfile note)
  security_opt: ["seccomp=unconfined", "apparmor=unconfined", "systempaths=unconfined"]
  networks: [pod]
  depends_on: [auth-proxy]

x-worker-env: &worker-env
  # Workers reach the brain THROUGH the proxy — tokenless; the proxy adds auth.
  CORRAL_BRAIN: http://auth-proxy:9019
  AGENT_WORKSPACE: /workspace
  AGENT_ROUNDS: "0"                # serve forever
  HARNESS_TIMEOUT_SECONDS: ${HARNESS_TIMEOUT_SECONDS:-900}
  HARNESS_IDLE_SECONDS: ${HARNESS_IDLE_SECONDS:-30}

services:
  # ── auth-injecting reverse proxy ────────────────────────────────────────
  # Adds `Authorization: Bearer <token>` to every request and forwards to the
  # host brain. The token is read from a mounted file (from the box credstore).
  auth-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [pod]
    # Read the mounted token file into WORKER_TOKEN, then hand off to nginx's
    # stock entrypoint, which runs envsubst over nginx.conf.template (replacing
    # ${WORKER_TOKEN} and ${BRAIN_UPSTREAM}; nginx's own $host/$remote_addr are
    # braceless and left untouched). Keeps the token out of `docker inspect`.
    entrypoint: ["/bin/sh","-c","export WORKER_TOKEN=\"$(cat /run/worker-token)\"; exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    extra_hosts:
      # Lets the proxy reach the host's 127.0.0.1 brain. NOTE: a brain bound to
      # 127.0.0.1 does NOT accept the docker-gateway IP — see README "Reaching
      # a loopback-bound brain" for the two options (host bind vs socket).
      - "host-brain:host-gateway"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${WORKER_TOKEN_FILE:?set WORKER_TOKEN_FILE to a file holding the worker bearer token}:/run/worker-token:ro
    environment:
      # nginx envsubst templating: the token is injected at container start.
      BRAIN_UPSTREAM: ${BRAIN_UPSTREAM:-http://host-brain:9019}

  # ── frontier workers (role → vendor per the proven Run D mapping) ────────
  builder:
    <<: *worker
    environment:
      <<: *worker-env
      AGENT_NAME: Claude
      AGENT_ROLE: builder
      AGENT_MODEL: ${CLAUDE_MODEL:-claude-opus-4-6}
      AGENT_BACKEND: anthropic
      HARNESS_CMD: 'claude -p {prompt} --mcp-config {mcp_config} --allowedTools mcp__corral__*,Read,Write,Edit,Bash --permission-mode acceptEdits'
    volumes:
      - workspace:/workspace
      # Mounted read-only under -host; entrypoint copies into a writable home so
      # the CLI can refresh its own tokens without mutating the box's creds.
      - ${CLAUDE_CREDS_DIR:?set CLAUDE_CREDS_DIR}:/seed/claude:ro

  tester:
    <<: *worker
    environment:
      <<: *worker-env
      AGENT_NAME: Gemini
      AGENT_ROLE: tester
      AGENT_MODEL: ${GEMINI_MODEL:-gemini-2.5-pro}
      AGENT_BACKEND: gemini
      # Gemini reads its MCP server from .gemini/settings.json in the workspace,
      # not from {mcp_config}. entrypoint writes it (pointing at the proxy).
      HARNESS_CMD: 'gemini {prompt} --approval-mode yolo --allowed-mcp-server-names corral'
    volumes:
      - workspace:/workspace
      - ${GEMINI_CREDS_DIR:?set GEMINI_CREDS_DIR}:/root/.gemini-host:ro

  pentester:
    <<: *worker
    environment:
      <<: *worker-env
      AGENT_NAME: Codex
      AGENT_ROLE: pentester
      AGENT_MODEL: ${CODEX_MODEL:-gpt-5.1-codex}
      AGENT_BACKEND: openai
      # Codex reads MCP from ~/.codex/config.toml; entrypoint adds the corral
      # entry (pointing at the proxy). --dangerously-bypass is REQUIRED (codex
      # auto-denies MCP tool calls under every approval mode) → its own sandbox
      # is OFF; the corral bwrap jail is the only boundary. See README warning.
      HARNESS_CMD: 'codex exec {prompt} --skip-git-repo-check --dangerously-bypass-approvals-and-sandbox'
    volumes:
      - workspace:/workspace
      - ${CODEX_CREDS_DIR:?set CODEX_CREDS_DIR}:/root/.codex-host:ro

  reviewer:
    <<: *worker
    environment:
      <<: *worker-env
      AGENT_NAME: Copilot
      AGENT_ROLE: reviewer
      AGENT_MODEL: ${COPILOT_MODEL:-gpt-5}
      AGENT_BACKEND: copilot
      HARNESS_CMD: 'copilot -p {prompt} --allow-all-tools --additional-mcp-config @{mcp_config}'
    volumes:
      - workspace:/workspace
      - ${COPILOT_CREDS_DIR:?set COPILOT_CREDS_DIR}:/root/.copilot-host:ro
      - ${GH_CONFIG_DIR:?set GH_CONFIG_DIR}:/root/.config/gh:ro

networks:
  pod:
    driver: bridge

volumes:
  # The herd's shared build surface. For real missions this is bind-mounted to a
  # host dir that is ALSO a git checkout the workers push from (jail → repo).
  workspace:
